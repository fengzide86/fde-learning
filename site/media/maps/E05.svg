<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1622" width="1800" height="1622" role="img" aria-labelledby="title">
<title id="title">工具建议与执行权限</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1622" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">E / 受约束的 AI 应用</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">E05  工具建议与执行权限</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">将 E02 的结构合同接到 D 的幂等写入；执行前重读事实，执行后以工具证据说明结果。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">模型只能建议动作；应用核对当前权限和确认后才执行，并另查真实效果。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="746.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">把操作建议接到受权执行</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">候选与可信输入</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,553.0 92.0,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="575.0" font-size="21" fill="#286f64" font-weight="700">工具执行建议（tool proposal）</text>
<text x="103.0" y="605.0" font-size="16" fill="#286f64" font-weight="400">不可信动作建议</text>
<text x="103.0" y="627.0" font-size="18" fill="#233734" font-weight="400">模型按工具描述提出动作和参数；名称在白名单且格式正</text>
<text x="103.0" y="652.0" font-size="18" fill="#233734" font-weight="400">确，仍只是一份操作建议。</text>
<polyline points="73.0,567.0 73.0,718.0 91.0,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="726.0" font-size="21" fill="#233734" font-weight="700">可信目标与发起人</text>
<text x="103.0" y="756.0" font-size="18" fill="#53635f" font-weight="400">对象来自应用路由与会话，身份来自已确认认证；不得让模</text>
<text x="103.0" y="781.0" font-size="18" fill="#53635f" font-weight="400">型填写这些授权事实。</text>
<polyline points="73.0,718.0 73.0,847.0 91.0,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="855.0" font-size="21" fill="#233734" font-weight="700">最少数据与工具</text>
<text x="103.0" y="885.0" font-size="18" fill="#53635f" font-weight="400">只发送当前建议必需字段，只开放工作流所需动作；执行工</text>
<text x="103.0" y="910.0" font-size="18" fill="#53635f" font-weight="400">具可按权限另取业务资料。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">允许这次写入的条件</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,553.0 658.3333333333334,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#286f64" font-weight="700">当前授权事实</text>
<text x="669.3333333333334" y="605.0" font-size="16" fill="#286f64" font-weight="400">应用重读的执行条件</text>
<text x="669.3333333333334" y="627.0" font-size="18" fill="#233734" font-weight="400">执行前由应用重读目标、分派、身份、权限和当前时段；模</text>
<text x="669.3333333333334" y="652.0" font-size="18" fill="#233734" font-weight="400">型填值、生成时或登录时快照都不能代替这次核对。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,718.0 657.3333333333334,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="726.0" font-size="21" fill="#233734" font-weight="700">确定性预览与确认</text>
<text x="669.3333333333334" y="756.0" font-size="18" fill="#53635f" font-weight="400">应用明确显示具体对象和时段，确认须绑定该动作；参数变</text>
<text x="669.3333333333334" y="781.0" font-size="18" fill="#53635f" font-weight="400">化后旧确认不再有效。</text>
<polyline points="639.3333333333334,718.0 639.3333333333334,847.0 657.3333333333334,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="855.0" font-size="21" fill="#233734" font-weight="700">检查与写入的竞争</text>
<text x="669.3333333333334" y="885.0" font-size="18" fill="#53635f" font-weight="400">并发可在检查后改变状态；真实系统需事务或版本条件，本</text>
<text x="669.3333333333334" y="910.0" font-size="18" fill="#53635f" font-weight="400">例同步内存判断不覆盖此问题。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">执行结果与降级</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,553.0 1224.6666666666667,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#286f64" font-weight="700">工具收据</text>
<text x="1235.6666666666667" y="605.0" font-size="16" fill="#286f64" font-weight="400">执行结果记录</text>
<text x="1235.6666666666667" y="627.0" font-size="18" fill="#233734" font-weight="400">记录执行得到的编号和时段，显示前仍须校验；生成说明不</text>
<text x="1235.6666666666667" y="652.0" font-size="18" fill="#233734" font-weight="400">能覆盖原始执行证据。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,718.0 1223.6666666666667,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="726.0" font-size="21" fill="#233734" font-weight="700">执行前拒绝与执行后异常</text>
<text x="1235.6666666666667" y="756.0" font-size="18" fill="#53635f" font-weight="400">调用前拒绝可说未执行；工具已生效但输出不安全时应核查</text>
<text x="1235.6666666666667" y="781.0" font-size="18" fill="#53635f" font-weight="400">并转人，不能谎称未做或盲重做。</text>
<polyline points="1205.6666666666667,718.0 1205.6666666666667,847.0 1223.6666666666667,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="855.0" font-size="21" fill="#233734" font-weight="700">只读权限与降级</text>
<text x="1235.6666666666667" y="885.0" font-size="18" fill="#53635f" font-weight="400">写入被拒绝后，仅在仍有读取权限时展示最新可选信息；只</text>
<text x="1235.6666666666667" y="910.0" font-size="18" fill="#53635f" font-weight="400">读不等于无须授权，降级不能绕过限制。</text>
<text x="64" y="974.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="974.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="999.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1032.0" font-size="21" fill="#233734" font-weight="700">确定性预览与确认</text>
<rect x="750" y="999.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1032.0" font-size="21" fill="#233734" font-weight="700">当前授权事实</text>
<polyline points="538,1036.0 736,1036.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1036.0 726.9955289764732,1040.3496553411123 726.9955289764732,1031.6503446588877" fill="#286f64"/>
<text x="586.0" y="1024.0" font-size="17" fill="#286f64" font-weight="400">仍须共同满足</text>
<text x="80" y="1082.0" font-size="18" fill="#53635f" font-weight="400">确认具体时段不能恢复已撤销权限，也不能保证时段现在仍空闲。</text>
<rect x="64" y="1122.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1155.2" font-size="21" fill="#233734" font-weight="700">工具收据</text>
<rect x="750" y="1122.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1155.2" font-size="21" fill="#233734" font-weight="700">执行前拒绝与执行后异常</text>
<polyline points="538,1159.2 736,1159.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1159.2 726.9955289764732,1163.5496553411124 726.9955289764732,1154.8503446588877" fill="#286f64"/>
<text x="603.0" y="1147.2" font-size="17" fill="#286f64" font-weight="400">支持判断</text>
<text x="80" y="1205.2" font-size="18" fill="#53635f" font-weight="400">没有安全可显示收据不等于没有效果，需按真实执行阶段处理。</text>
<rect x="64" y="1245.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1278.4" font-size="21" fill="#233734" font-weight="700">当前授权事实</text>
<rect x="750" y="1245.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1278.4" font-size="21" fill="#233734" font-weight="700">只读权限与降级</text>
<polyline points="538,1282.4 736,1282.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1282.4 726.9955289764732,1286.7496553411124 726.9955289764732,1278.0503446588878" fill="#286f64"/>
<text x="586.0" y="1270.4" font-size="17" fill="#286f64" font-weight="400">限定可读范围</text>
<text x="80" y="1328.4" font-size="18" fill="#53635f" font-weight="400">拒绝写入后仍须确认读取资格；没有读取权限时，不能以降级名义展示资料。</text>
<rect x="64" y="1368.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1401.6000000000001" font-size="21" fill="#233734" font-weight="700">工具执行建议（tool proposal）</text>
<rect x="750" y="1368.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1401.6000000000001" font-size="21" fill="#233734" font-weight="700">当前授权事实</text>
<polyline points="538,1405.6000000000001 736,1405.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1405.6000000000001 726.9955289764732,1409.9496553411125 726.9955289764732,1401.2503446588878" fill="#286f64"/>
<text x="586.0" y="1393.6000000000001" font-size="17" fill="#286f64" font-weight="400">须由应用核对</text>
<text x="80" y="1451.6000000000001" font-size="18" fill="#53635f" font-weight="400">模型建议本身不提供授权；目标、身份和最新业务条件来自可信应用路径。</text>
<text x="64" y="1503.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：重复请求与业务效果。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1566.4 1736,1566.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1596.4" font-size="17" fill="#53635f" font-weight="400">对照正文：E05  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1697" width="1800" height="1697" role="img" aria-labelledby="title">
<title id="title">数据结构与约束</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1697" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">C / 数据与日志</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">C03  数据结构与约束</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">把 C02 读取时依赖的关系写成保存规则；C04再保证多处合法写入共同完成业务动作。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">身份把分散的事实连起来，约束拒绝不允许保存的状态；它们还不会自动完成一整次预约。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="690.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">可信事实的身份、约束与结构变化</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,437.0 1537.125,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,437.0 262.875,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">对象身份与事实位置</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="358.75" height="160" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,553.0 92.0,697.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="575.0" font-size="21" fill="#286f64" font-weight="700">业务对象与主键</text>
<text x="103.0" y="605.0" font-size="16" fill="#286f64" font-weight="400">事实身份</text>
<text x="103.0" y="627.0" font-size="18" fill="#233734" font-weight="400">客户、工单、技术员、时段和预约有独立</text>
<text x="103.0" y="652.0" font-size="18" fill="#233734" font-weight="400">身份；预约经工单找客户，经时段找技术</text>
<text x="103.0" y="677.0" font-size="18" fill="#233734" font-weight="400">员。</text>
<polyline points="73.0,567.0 73.0,743.0 91.0,743.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="721.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="751.0" font-size="21" fill="#233734" font-weight="700">规范化</text>
<text x="103.0" y="781.0" font-size="18" fill="#53635f" font-weight="400">可独立变化的事实集中保存，通过身份引</text>
<text x="103.0" y="806.0" font-size="18" fill="#53635f" font-weight="400">用以减少矛盾；当前邮箱不同于当时发信</text>
<text x="103.0" y="831.0" font-size="18" fill="#53635f" font-weight="400">地址。</text>
<polyline points="73.0,743.0 73.0,897.0 91.0,897.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="875.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="905.0" font-size="21" fill="#233734" font-weight="700">中间表与组合主键</text>
<text x="103.0" y="935.0" font-size="18" fill="#53635f" font-weight="400">技术员技能关系每行存一对身份，组合主</text>
<text x="103.0" y="960.0" font-size="18" fill="#53635f" font-weight="400">键防重复配对，同时允许一人多技能与一</text>
<text x="103.0" y="985.0" font-size="18" fill="#53635f" font-weight="400">技多人。</text>
<polyline points="687.625,437.0 687.625,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="488.75" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="502.75" y="502.0" font-size="23" fill="#286f64" font-weight="700">引用与数量规则</text>
<polyline points="497.75,525.0 497.75,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="497.75,525.0 497.75,567.0 515.75,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="545.0" width="358.75" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="516.75,553.0 516.75,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="527.75" y="575.0" font-size="21" fill="#286f64" font-weight="700">引用约束（FOREIGN KEY）</text>
<text x="527.75" y="605.0" font-size="16" fill="#286f64" font-weight="400">引用约束</text>
<text x="527.75" y="627.0" font-size="18" fill="#233734" font-weight="400">拒绝不存在的引用目标；SQLite须每个连</text>
<text x="527.75" y="652.0" font-size="18" fill="#233734" font-weight="400">接在事务外开启并读回foreign_keys设置。</text>
<polyline points="497.75,567.0 497.75,718.0 515.75,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="696.0" width="358.75" height="160" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="726.0" font-size="21" fill="#233734" font-weight="700">唯一约束（UNIQUE）</text>
<text x="527.75" y="756.0" font-size="16" fill="#286f64" font-weight="400">唯一性约束</text>
<text x="527.75" y="778.0" font-size="18" fill="#53635f" font-weight="400">限制确定值或组合重复；slot_id唯一使历</text>
<text x="527.75" y="803.0" font-size="18" fill="#53635f" font-weight="400">史预约也占该时段，多个NULL并不由</text>
<text x="527.75" y="828.0" font-size="18" fill="#53635f" font-weight="400">UNIQUE拒绝。</text>
<polyline points="497.75,718.0 497.75,894.0 515.75,894.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="872.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="902.0" font-size="21" fill="#233734" font-weight="700">删除时保护引用（ON DELETE RESTRICT）</text>
<text x="527.75" y="932.0" font-size="18" fill="#53635f" font-weight="400">仍被引用的父行不能删除，保护引用链；</text>
<text x="527.75" y="957.0" font-size="18" fill="#53635f" font-weight="400">取消业务状态不自动解除历史引用。</text>
<polyline points="1112.375,437.0 1112.375,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="913.5" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="927.5" y="502.0" font-size="23" fill="#286f64" font-weight="700">类型、缺失与取值</text>
<polyline points="922.5,525.0 922.5,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="922.5,525.0 922.5,567.0 940.5,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="545.0" width="358.75" height="160" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="575.0" font-size="21" fill="#233734" font-weight="700">类型亲和性</text>
<text x="952.5" y="605.0" font-size="16" fill="#286f64" font-weight="400">存储类型规则</text>
<text x="952.5" y="627.0" font-size="18" fill="#53635f" font-weight="400">普通SQLite列偏好存储类型但允许部分其</text>
<text x="952.5" y="652.0" font-size="18" fill="#53635f" font-weight="400">他类别；INTEGER不独自拒绝文字、小数</text>
<text x="952.5" y="677.0" font-size="18" fill="#53635f" font-weight="400">或负数。</text>
<polyline points="922.5,567.0 922.5,743.0 940.5,743.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="721.0" width="358.75" height="138" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="941.5,729.0 941.5,851.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="952.5" y="751.0" font-size="21" fill="#286f64" font-weight="700">必填与范围约束（NOT NULL / CHECK）</text>
<text x="952.5" y="781.0" font-size="18" fill="#233734" font-weight="400">前者拒绝未知，后者约束种类与范围；</text>
<text x="952.5" y="806.0" font-size="18" fill="#233734" font-weight="400">CHECK结果为NULL不算违反，必填规则需</text>
<text x="952.5" y="831.0" font-size="18" fill="#233734" font-weight="400">两者配合。</text>
<polyline points="922.5,743.0 922.5,897.0 940.5,897.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="875.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="905.0" font-size="21" fill="#233734" font-weight="700">缺省值与可空事实（DEFAULT）</text>
<text x="952.5" y="935.0" font-size="18" fill="#53635f" font-weight="400">省略字段采用已确定初值，显式NULL不等</text>
<text x="952.5" y="960.0" font-size="18" fill="#53635f" font-weight="400">于省略；未知电话保留NULL，不造假号</text>
<text x="952.5" y="985.0" font-size="18" fill="#53635f" font-weight="400">码。</text>
<polyline points="1537.125,437.0 1537.125,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1338.25" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1352.25" y="502.0" font-size="23" fill="#286f64" font-weight="700">规则作用范围</text>
<polyline points="1347.25,525.0 1347.25,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1347.25,525.0 1347.25,567.0 1365.25,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="545.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="575.0" font-size="21" fill="#233734" font-weight="700">数据结构与应用判断（schema）</text>
<text x="1377.25" y="605.0" font-size="18" fill="#53635f" font-weight="400">结构保护可表达的规则；日期有效性、身</text>
<text x="1377.25" y="630.0" font-size="18" fill="#53635f" font-weight="400">份权限和技能匹配仍须应用检查，不由</text>
<text x="1377.25" y="655.0" font-size="18" fill="#53635f" font-weight="400">TEXT自动保证。</text>
<polyline points="1347.25,567.0 1347.25,721.0 1365.25,721.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="699.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="729.0" font-size="21" fill="#233734" font-weight="700">约束失败的前后核对</text>
<text x="1377.25" y="759.0" font-size="18" fill="#53635f" font-weight="400">用已知坏值触发具体约束并比较前后行；</text>
<text x="1377.25" y="784.0" font-size="18" fill="#53635f" font-weight="400">单行合法尚不能证明时段、预约共同更</text>
<text x="1377.25" y="809.0" font-size="18" fill="#53635f" font-weight="400">新。</text>
<text x="64" y="1049.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1049.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1074.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1107.0" font-size="21" fill="#233734" font-weight="700">业务对象与主键</text>
<rect x="750" y="1074.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1107.0" font-size="21" fill="#233734" font-weight="700">引用约束（FOREIGN KEY）</text>
<polyline points="538,1111.0 736,1111.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1111.0 726.9955289764732,1115.3496553411123 726.9955289764732,1106.6503446588877" fill="#286f64"/>
<text x="569.0" y="1099.0" font-size="17" fill="#286f64" font-weight="400">引用列由规则保护</text>
<text x="80" y="1157.0" font-size="18" fill="#53635f" font-weight="400">预约→工单→客户，预约→时段→技术员；外键保护已写明的引用，不会替查询自动关联。</text>
<rect x="64" y="1197.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1230.2" font-size="21" fill="#233734" font-weight="700">引用约束（FOREIGN KEY）</text>
<rect x="750" y="1197.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1230.2" font-size="21" fill="#233734" font-weight="700">唯一约束（UNIQUE）</text>
<polyline points="538,1234.2 736,1234.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1234.2 726.9955289764732,1238.5496553411124 726.9955289764732,1229.8503446588877" fill="#286f64"/>
<text x="586.0" y="1222.2" font-size="17" fill="#286f64" font-weight="400">配合数量约束</text>
<text x="80" y="1280.2" font-size="18" fill="#53635f" font-weight="400">前者保证预约引用真实时段，后者保证这个时段最多出现在一条预约中。</text>
<rect x="64" y="1320.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1353.4" font-size="21" fill="#233734" font-weight="700">类型亲和性</text>
<rect x="750" y="1320.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1353.4" font-size="21" fill="#233734" font-weight="700">必填与范围约束（NOT NULL / CHECK）</text>
<polyline points="538,1357.4 736,1357.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1357.4 726.9955289764732,1361.7496553411124 726.9955289764732,1353.0503446588878" fill="#286f64"/>
<text x="603.0" y="1345.4" font-size="17" fill="#286f64" font-weight="400">需要补充</text>
<text x="80" y="1403.4" font-size="18" fill="#53635f" font-weight="400">时长必须是正整数且已知，必须明确检查实际存储类别、正值和非空。</text>
<rect x="64" y="1443.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1476.6000000000001" font-size="21" fill="#233734" font-weight="700">规范化</text>
<rect x="750" y="1443.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1476.6000000000001" font-size="21" fill="#233734" font-weight="700">中间表与组合主键</text>
<polyline points="538,1480.6000000000001 736,1480.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1480.6000000000001 726.9955289764732,1484.9496553411125 726.9955289764732,1476.2503446588878" fill="#286f64"/>
<text x="577.5" y="1468.6000000000001" font-size="17" fill="#286f64" font-weight="400">组织多对多事实</text>
<text x="80" y="1526.6000000000001" font-size="18" fill="#53635f" font-weight="400">技能不塞在一个逗号字符串中，各项技能可以分别引用、修改和查找。</text>
<text x="64" y="1578.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：旧事实的迁移。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1641.4 1736,1641.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1671.4" font-size="17" fill="#53635f" font-weight="400">对照正文：C03  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1635" width="1800" height="1635" role="img" aria-labelledby="title">
<title id="title">指标、归因与业务价值</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1635" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">P / 产品与业务</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">P12  指标、归因与业务价值</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">解释 P11 的运行记录，并重检 P07 的收益假设；过程、客户结果与成本共同支持继续或调整。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">先核对指标数的是什么、未知在哪里，再判断变化是否意味着业务改善。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="746.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">从观察口径读回实际价值</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 1466.3333333333335,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 333.6666666666667,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">指标怎样定义</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,516.0 92.0,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="538.0" font-size="21" fill="#286f64" font-weight="700">指标对象与计数单位</text>
<text x="103.0" y="568.0" font-size="18" fill="#233734" font-weight="400">按当前问题数独立案例、消息或动作；同一求助追问多次可</text>
<text x="103.0" y="593.0" font-size="18" fill="#233734" font-weight="400">是一件重复联系案例。</text>
<polyline points="73.0,530.0 73.0,659.0 91.0,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="667.0" font-size="21" fill="#233734" font-weight="700">中位数与分布边界</text>
<text x="103.0" y="697.0" font-size="18" fill="#53635f" font-weight="400">排序取中部，偶数样本取中间两项均值；中位数降低不能证</text>
<text x="103.0" y="722.0" font-size="18" fill="#53635f" font-weight="400">明人人更快或无人超时。</text>
<polyline points="73.0,659.0 73.0,788.0 91.0,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="796.0" font-size="21" fill="#233734" font-weight="700">分子、分母与百分点</text>
<text x="103.0" y="826.0" font-size="18" fill="#53635f" font-weight="400">比例须连适用全集阅读，比例相减用百分点；不能剔除缺承</text>
<text x="103.0" y="851.0" font-size="18" fill="#53635f" font-weight="400">接案例来美化结果。</text>
<polyline points="73.0,788.0 73.0,917.0 91.0,917.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="895.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="925.0" font-size="21" fill="#233734" font-weight="700">可比范围与观察期</text>
<text x="103.0" y="955.0" font-size="18" fill="#53635f" font-weight="400">对齐入口、业务类型、服务适用时段与完整观察机会；新旧</text>
<text x="103.0" y="980.0" font-size="18" fill="#53635f" font-weight="400">案例观察长短不同会造成误读。</text>
<polyline points="900.0,400.0 900.0,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="465.0" font-size="23" fill="#286f64" font-weight="700">未知与因果边界</text>
<polyline points="639.3333333333334,488.0 639.3333333333334,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,488.0 639.3333333333334,530.0 657.3333333333334,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,516.0 658.3333333333334,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="538.0" font-size="21" fill="#286f64" font-weight="700">确认结果与未知</text>
<text x="669.3333333333334" y="568.0" font-size="18" fill="#233734" font-weight="400">未收到解决确认不等于已确认未解决，也不能默认满意；须</text>
<text x="669.3333333333334" y="593.0" font-size="18" fill="#233734" font-weight="400">保留仍在处理和信息不足等区别。</text>
<polyline points="639.3333333333334,530.0 639.3333333333334,659.0 657.3333333333334,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="667.0" font-size="21" fill="#233734" font-weight="700">记录与收集方式</text>
<text x="669.3333333333334" y="697.0" font-size="18" fill="#53635f" font-weight="400">方案可能改变记录完整性和客户确认动作；指标变化可能来</text>
<text x="669.3333333333334" y="722.0" font-size="18" fill="#53635f" font-weight="400">自收集过程，而非实际效果改变。</text>
<polyline points="639.3333333333334,659.0 639.3333333333334,788.0 657.3333333333334,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="796.0" font-size="21" fill="#233734" font-weight="700">关联与因果</text>
<text x="669.3333333333334" y="826.0" font-size="18" fill="#53635f" font-weight="400">可比组表现不同仍可能受人员、负荷等影响；更强归因需补</text>
<text x="669.3333333333334" y="851.0" font-size="18" fill="#53635f" font-weight="400">证，风险出现时可先缩小暴露。</text>
<polyline points="1466.3333333333335,400.0 1466.3333333333335,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="465.0" font-size="23" fill="#286f64" font-weight="700">价值与后续判断</text>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,530.0 1223.6666666666667,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,516.0 1224.6666666666667,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="538.0" font-size="21" fill="#286f64" font-weight="700">过程、结果与负担</text>
<text x="1235.6666666666667" y="568.0" font-size="18" fill="#233734" font-weight="400">过程看改进机制是否发生，结果看目标是否达到，额外负担</text>
<text x="1235.6666666666667" y="593.0" font-size="18" fill="#233734" font-weight="400">看代价转移；不能互相代替。</text>
<polyline points="1205.6666666666667,530.0 1205.6666666666667,659.0 1223.6666666666667,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="667.0" font-size="21" fill="#233734" font-weight="700">采用、净省时与实际用途</text>
<text x="1235.6666666666667" y="697.0" font-size="18" fill="#53635f" font-weight="400">收益估计须乘实际适用和采用条件，再看时间用途及维护成</text>
<text x="1235.6666666666667" y="722.0" font-size="18" fill="#53635f" font-weight="400">本；理论工时价值不等于现金。</text>
<polyline points="1205.6666666666667,659.0 1205.6666666666667,788.0 1223.6666666666667,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="796.0" font-size="21" fill="#233734" font-weight="700">继续、调整或停止</text>
<text x="1235.6666666666667" y="826.0" font-size="18" fill="#53635f" font-weight="400">证据有限可继续小范围观察，维护过重可改方案，假设相反</text>
<text x="1235.6666666666667" y="851.0" font-size="18" fill="#53635f" font-weight="400">或风险不可承受时缩小或暂停。</text>
<text x="64" y="1044.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1044.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1069.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1102.0" font-size="21" fill="#233734" font-weight="700">记录与收集方式</text>
<rect x="750" y="1069.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1102.0" font-size="21" fill="#233734" font-weight="700">确认结果与未知</text>
<polyline points="538,1106.0 736,1106.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1106.0 726.9955289764732,1110.3496553411123 726.9955289764732,1101.6503446588877" fill="#286f64"/>
<text x="586.0" y="1094.0" font-size="17" fill="#286f64" font-weight="400">影响观测到的</text>
<text x="80" y="1152.0" font-size="18" fill="#53635f" font-weight="400">少问一次客户是否解决可能使确认比例下降，却尚不能说明真实修复率下降。</text>
<rect x="64" y="1192.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1225.2" font-size="21" fill="#233734" font-weight="700">可比范围与观察期</text>
<rect x="750" y="1192.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1225.2" font-size="21" fill="#233734" font-weight="700">关联与因果</text>
<polyline points="538,1229.2 736,1229.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1229.2 726.9955289764732,1233.5496553411124 726.9955289764732,1224.8503446588877" fill="#286f64"/>
<text x="586.0" y="1217.2" font-size="17" fill="#286f64" font-weight="400">支持但不完成</text>
<text x="80" y="1275.2" font-size="18" fill="#53635f" font-weight="400">范围与时长一致只排除部分误读，仍需核对人员、负荷与同时发生的变化。</text>
<rect x="64" y="1315.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1348.4" font-size="21" fill="#233734" font-weight="700">过程、结果与负担</text>
<rect x="750" y="1315.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1348.4" font-size="21" fill="#233734" font-weight="700">继续、调整或停止</text>
<polyline points="538,1352.4 736,1352.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1352.4 726.9955289764732,1356.7496553411124 726.9955289764732,1348.0503446588878" fill="#286f64"/>
<text x="603.0" y="1340.4" font-size="17" fill="#286f64" font-weight="400">共同支持</text>
<text x="80" y="1398.4" font-size="18" fill="#53635f" font-weight="400">承接记录形成不自动证明客户受益，客户收益也需连同维护代价判断。</text>
<rect x="64" y="1438.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1471.6000000000001" font-size="21" fill="#233734" font-weight="700">采用、净省时与实际用途</text>
<rect x="750" y="1438.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1471.6000000000001" font-size="21" fill="#233734" font-weight="700">继续、调整或停止</text>
<polyline points="538,1475.6000000000001 736,1475.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1475.6000000000001 726.9955289764732,1479.9496553411125 726.9955289764732,1471.2503446588878" fill="#286f64"/>
<text x="586.0" y="1463.6000000000001" font-size="17" fill="#286f64" font-weight="400">检验价值前提</text>
<text x="80" y="1521.6000000000001" font-size="18" fill="#53635f" font-weight="400">实际只一半采用时应重算收益，不能沿用完全采用的原估计作投入结论。</text>
<polyline points="64,1579.8000000000002 1736,1579.8000000000002" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1609.8000000000002" font-size="17" fill="#53635f" font-weight="400">对照正文：P12  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
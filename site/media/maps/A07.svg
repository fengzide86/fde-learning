<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2214" width="1800" height="2214" role="img" aria-labelledby="title">
<title id="title">怎样知道这次修改真的修好了？</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="2214" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">A / 程序与工具</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">A07  怎样知道这次修改真的修好了？</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">A07利用A06可导入的函数固定行为要求；A09补运行环境证据，A13把验证延伸到完整文件处理。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">9:30 按规则应为 570，函数却返回 540：先解释这份差异，再让 assert 固定要求、pytest 重复调用；修复后重跑原例，不靠改预期换取通过。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="732.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">行为预期、故障定位与回归</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">行为要求与案例</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,553.0 92.0,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="575.0" font-size="21" fill="#286f64" font-weight="700">独立预期</text>
<text x="103.0" y="605.0" font-size="16" fill="#286f64" font-weight="400">来自需求的判断依据</text>
<text x="103.0" y="627.0" font-size="18" fill="#233734" font-weight="400">从需求推导应该得到什么，不照抄当前输出；测试失败时先</text>
<text x="103.0" y="652.0" font-size="18" fill="#233734" font-weight="400">核对需求，再追实际偏差。</text>
<polyline points="73.0,567.0 73.0,718.0 91.0,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="726.0" font-size="21" fill="#233734" font-weight="700">边界与区分案例</text>
<text x="103.0" y="756.0" font-size="18" fill="#53635f" font-weight="400">选能揭露不同遗漏的输入，如非整点、范围端点和越界；不</text>
<text x="103.0" y="781.0" font-size="18" fill="#53635f" font-weight="400">靠重复相似案例凑数量。</text>
<polyline points="73.0,718.0 73.0,847.0 91.0,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="855.0" font-size="21" fill="#233734" font-weight="700">返回值与显示行为</text>
<text x="103.0" y="885.0" font-size="18" fill="#53635f" font-weight="400">测试返回数值时检查调用结果；print只输出且返回None，显</text>
<text x="103.0" y="910.0" font-size="18" fill="#53635f" font-weight="400">示本身需另外捕获验证。</text>
<polyline points="73.0,847.0 73.0,976.0 91.0,976.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="954.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="984.0" font-size="21" fill="#233734" font-weight="700">测试覆盖边界</text>
<text x="103.0" y="1014.0" font-size="18" fill="#53635f" font-weight="400">通过只证明执行过的案例符合其断言；不自动覆盖未测输</text>
<text x="103.0" y="1039.0" font-size="18" fill="#53635f" font-weight="400">入、整套应用或真实环境。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">自动检查</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,553.0 658.3333333333334,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#286f64" font-weight="700">固定预期并核对（assert）</text>
<text x="669.3333333333334" y="605.0" font-size="16" fill="#286f64" font-weight="400">Python断言语句</text>
<text x="669.3333333333334" y="627.0" font-size="18" fill="#233734" font-weight="400">条件为假时发出AssertionError，表达实际值应满足的要求；</text>
<text x="669.3333333333334" y="652.0" font-size="18" fill="#233734" font-weight="400">可能被优化移除，不代替输入校验。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,718.0 657.3333333333334,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="696.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,704.0 658.3333333333334,823.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="726.0" font-size="21" fill="#286f64" font-weight="700">重复运行并发现测试（pytest）</text>
<text x="669.3333333333334" y="756.0" font-size="16" fill="#286f64" font-weight="400">测试运行工具</text>
<text x="669.3333333333334" y="778.0" font-size="18" fill="#233734" font-weight="400">按文件与test_函数约定收集调用并汇报；直接运行仅定义函</text>
<text x="669.3333333333334" y="803.0" font-size="18" fill="#233734" font-weight="400">数的测试脚本不等于执行测试。</text>
<polyline points="639.3333333333334,718.0 639.3333333333334,869.0 657.3333333333334,869.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="847.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="877.0" font-size="21" fill="#233734" font-weight="700">主动制造失败（raise）</text>
<text x="669.3333333333334" y="907.0" font-size="16" fill="#286f64" font-weight="400">发出异常的语句</text>
<text x="669.3333333333334" y="929.0" font-size="18" fill="#53635f" font-weight="400">主动发出约定异常以拒绝越界值；与接住已有异常的except</text>
<text x="669.3333333333334" y="954.0" font-size="18" fill="#53635f" font-weight="400">方向相反，不返回正常结果。</text>
<polyline points="639.3333333333334,869.0 639.3333333333334,1020.0 657.3333333333334,1020.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="998.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="1028.0" font-size="21" fill="#233734" font-weight="700">核对预期异常（pytest.raises）</text>
<text x="669.3333333333334" y="1058.0" font-size="16" fill="#286f64" font-weight="400">测试中的异常检查工具</text>
<text x="669.3333333333334" y="1080.0" font-size="18" fill="#53635f" font-weight="400">在限定代码块预期指定异常或其子类；没有异常或类型不匹</text>
<text x="669.3333333333334" y="1105.0" font-size="18" fill="#53635f" font-weight="400">配都失败，并非忽略所有错误。</text>
<polyline points="639.3333333333334,1020.0 639.3333333333334,1171.0 657.3333333333334,1171.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="1149.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,1157.0 658.3333333333334,1276.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="1179.0" font-size="21" fill="#286f64" font-weight="700">回归检查</text>
<text x="669.3333333333334" y="1209.0" font-size="16" fill="#286f64" font-weight="400">修复后的验证</text>
<text x="669.3333333333334" y="1231.0" font-size="18" fill="#233734" font-weight="400">修复后重跑原有案例，既确认原错误已修复，也检查先前正</text>
<text x="669.3333333333334" y="1256.0" font-size="18" fill="#233734" font-weight="400">确的行为没有被破坏。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">观察失败位置</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#233734" font-weight="700">失败位置报告（traceback）</text>
<text x="1235.6666666666667" y="605.0" font-size="18" fill="#53635f" font-weight="400">报告展示实际与预期差异，回溯展示异常传出的调用路径；</text>
<text x="1235.6666666666667" y="630.0" font-size="18" fill="#53635f" font-weight="400">它不是全部执行历史或变量快照。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,696.0 1223.6666666666667,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="704.0" font-size="21" fill="#233734" font-weight="700">最小复现</text>
<text x="1235.6666666666667" y="734.0" font-size="18" fill="#53635f" font-weight="400">保留仍能重复失败的最小入口，减少无关交互；缩小后不再</text>
<text x="1235.6666666666667" y="759.0" font-size="18" fill="#53635f" font-weight="400">失败时不能直接丢弃被删部分。</text>
<polyline points="1205.6666666666667,696.0 1205.6666666666667,825.0 1223.6666666666667,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="833.0" font-size="21" fill="#233734" font-weight="700">临时打印</text>
<text x="1235.6666666666667" y="863.0" font-size="18" fill="#53635f" font-weight="400">观察参数与中间值以定位偏差，定位后移除；它不是可重复</text>
<text x="1235.6666666666667" y="888.0" font-size="18" fill="#53635f" font-weight="400">核对行为的永久测试。</text>
<polyline points="1205.6666666666667,825.0 1205.6666666666667,954.0 1223.6666666666667,954.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="932.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="962.0" font-size="21" fill="#233734" font-weight="700">暂停观察执行（breakpoint / step）</text>
<text x="1235.6666666666667" y="992.0" font-size="18" fill="#53635f" font-weight="400">暂停时先确认当前行是否已执行，再观察值与下一步；pdb</text>
<text x="1235.6666666666667" y="1017.0" font-size="18" fill="#53635f" font-weight="400">的n与s分别偏向越过或进入调用。</text>
<text x="64" y="1320.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1320.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1345.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1378.0" font-size="21" fill="#233734" font-weight="700">独立预期</text>
<rect x="750" y="1345.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1378.0" font-size="21" fill="#233734" font-weight="700">固定预期并核对（assert）</text>
<polyline points="538,1382.0 736,1382.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1382.0 726.9955289764732,1386.3496553411123 726.9955289764732,1377.6503446588877" fill="#286f64"/>
<text x="586.0" y="1370.0" font-size="17" fill="#286f64" font-weight="400">写成检查条件</text>
<text x="80" y="1428.0" font-size="18" fill="#53635f" font-weight="400">改错时不能仅为变绿而把预期改成当前错误输出。</text>
<rect x="64" y="1468.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1501.2" font-size="21" fill="#233734" font-weight="700">主动制造失败（raise）</text>
<rect x="750" y="1468.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1501.2" font-size="21" fill="#233734" font-weight="700">核对预期异常（pytest.raises）</text>
<polyline points="538,1505.2 736,1505.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1505.2 726.9955289764732,1509.5496553411124 726.9955289764732,1500.8503446588877" fill="#286f64"/>
<text x="577.5" y="1493.2" font-size="17" fill="#286f64" font-weight="400">由预期失败验证</text>
<text x="80" y="1551.2" font-size="18" fill="#53635f" font-weight="400">合法拒绝也是函数承诺；测试应验证拒绝类型而非要求每次调用成功。</text>
<rect x="64" y="1591.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1624.4" font-size="21" fill="#233734" font-weight="700">最小复现</text>
<rect x="750" y="1591.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1624.4" font-size="21" fill="#233734" font-weight="700">暂停观察执行（breakpoint / step）</text>
<polyline points="538,1628.4 736,1628.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1628.4 726.9955289764732,1632.7496553411124 726.9955289764732,1624.0503446588878" fill="#286f64"/>
<text x="586.0" y="1616.4" font-size="17" fill="#286f64" font-weight="400">提供观察入口</text>
<text x="80" y="1674.4" font-size="18" fill="#53635f" font-weight="400">观察的对象应仍保留原失败，暂停后先确认位置再读值。</text>
<rect x="64" y="1714.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1747.6000000000001" font-size="21" fill="#233734" font-weight="700">边界与区分案例</text>
<rect x="750" y="1714.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1747.6000000000001" font-size="21" fill="#233734" font-weight="700">回归检查</text>
<polyline points="538,1751.6000000000001 736,1751.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1751.6000000000001 726.9955289764732,1755.9496553411125 726.9955289764732,1747.2503446588878" fill="#286f64"/>
<text x="577.5" y="1739.6000000000001" font-size="17" fill="#286f64" font-weight="400">共同保护旧行为</text>
<text x="80" y="1797.6000000000001" font-size="18" fill="#53635f" font-weight="400">只保留刚失败的一个案例，会漏掉硬编码结果等新错误。</text>
<rect x="64" y="1837.8000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1870.8000000000002" font-size="21" fill="#233734" font-weight="700">重复运行并发现测试（pytest）</text>
<rect x="750" y="1837.8000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1870.8000000000002" font-size="21" fill="#233734" font-weight="700">固定预期并核对（assert）</text>
<polyline points="538,1874.8000000000002 736,1874.8000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1874.8000000000002 726.9955289764732,1879.1496553411125 726.9955289764732,1870.4503446588878" fill="#286f64"/>
<text x="569.0" y="1862.8000000000002" font-size="17" fill="#286f64" font-weight="400">运行含断言的测试</text>
<text x="80" y="1920.8000000000002" font-size="18" fill="#53635f" font-weight="400">assert本身能检查条件，并非由pytest激活；pytest负责收集、调用与报告。</text>
<rect x="64" y="1961.0000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1994.0000000000002" font-size="21" fill="#233734" font-weight="700">失败位置报告（traceback）</text>
<rect x="750" y="1961.0000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1994.0000000000002" font-size="21" fill="#233734" font-weight="700">最小复现</text>
<polyline points="538,1998.0000000000002 736,1998.0000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1998.0000000000002 726.9955289764732,2002.3496553411126 726.9955289764732,1993.650344658888" fill="#286f64"/>

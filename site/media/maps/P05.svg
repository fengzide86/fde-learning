<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1635" width="1800" height="1635" role="img" aria-labelledby="title">
<title id="title">等待、工时与原因</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1635" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">P / 产品与业务</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">P05  等待、工时与原因</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">在 P04 的任务与交接上量时间；为 P06 选择改变位置、P07 估算投入提供不同的时间依据。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">先分清客户经过的时间与人的实际投入，再沿等待和依赖判断哪里值得改变。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="746.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">沿真实工作解释时间消耗</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 1466.3333333333335,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 333.6666666666667,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">时间的衡量对象</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,516.0 92.0,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="538.0" font-size="21" fill="#286f64" font-weight="700">经过时间</text>
<text x="103.0" y="568.0" font-size="18" fill="#233734" font-weight="400">选定对象和起止点之间走过的时间；到可行时段的总时长不</text>
<text x="103.0" y="593.0" font-size="18" fill="#233734" font-weight="400">等于维修完成时间。</text>
<polyline points="73.0,530.0 73.0,659.0 91.0,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,645.0 92.0,742.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="667.0" font-size="21" fill="#286f64" font-weight="700">处理时间与人分钟</text>
<text x="103.0" y="697.0" font-size="18" fill="#233734" font-weight="400">处理时间看实际操作，人分钟累计人的投入；两人并行六分</text>
<text x="103.0" y="722.0" font-size="18" fill="#233734" font-weight="400">钟可投入十二人分钟。</text>
<polyline points="73.0,659.0 73.0,788.0 91.0,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="796.0" font-size="21" fill="#233734" font-weight="700">等待时间</text>
<text x="103.0" y="826.0" font-size="18" fill="#53635f" font-weight="400">工作已能进入下一步或正在等必要结果的区间；有人同时做</text>
<text x="103.0" y="851.0" font-size="18" fill="#53635f" font-weight="400">其他动作时不能简单重复相加。</text>
<polyline points="900.0,400.0 900.0,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="465.0" font-size="23" fill="#286f64" font-weight="700">可能造成等待的机制</text>
<polyline points="639.3333333333334,488.0 639.3333333333334,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,488.0 639.3333333333334,530.0 657.3333333333334,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="538.0" font-size="21" fill="#233734" font-weight="700">批处理</text>
<text x="669.3333333333334" y="568.0" font-size="18" fill="#53635f" font-weight="400">凑成一批减少切换或便于核对，也使已准备好的材料等待；</text>
<text x="669.3333333333334" y="593.0" font-size="18" fill="#53635f" font-weight="400">缩小批次须比较新增交接负担。</text>
<polyline points="639.3333333333334,530.0 639.3333333333334,659.0 657.3333333333334,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="667.0" font-size="21" fill="#233734" font-weight="700">资源争用与到达节奏</text>
<text x="669.3333333333334" y="697.0" font-size="18" fill="#53635f" font-weight="400">有限人员或能力一次只能处理部分工作；相同总量因集中到</text>
<text x="669.3333333333334" y="722.0" font-size="18" fill="#53635f" font-weight="400">达、波动和中断产生不同等待。</text>
<polyline points="639.3333333333334,659.0 639.3333333333334,788.0 657.3333333333334,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="796.0" font-size="21" fill="#233734" font-weight="700">返工与新信息</text>
<text x="669.3333333333334" y="826.0" font-size="18" fill="#53635f" font-weight="400">前次结果不满足需要而重做可能再次排队；补充新事实或必</text>
<text x="669.3333333333334" y="851.0" font-size="18" fill="#53635f" font-weight="400">要复核不应一律算无价值返工。</text>
<polyline points="639.3333333333334,788.0 639.3333333333334,917.0 657.3333333333334,917.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="895.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="925.0" font-size="21" fill="#233734" font-weight="700">交接缺口</text>
<text x="669.3333333333334" y="955.0" font-size="18" fill="#53635f" font-weight="400">请求未被可靠看见或承接也会形成等待；先检查责任与通</text>
<text x="669.3333333333334" y="980.0" font-size="18" fill="#53635f" font-weight="400">知，不能直接归因于人手效率。</text>
<polyline points="1466.3333333333335,400.0 1466.3333333333335,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="465.0" font-size="23" fill="#286f64" font-weight="700">因果判断与方案预测</text>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,530.0 1223.6666666666667,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="538.0" font-size="21" fill="#233734" font-weight="700">原因假设与区分观察</text>
<text x="1235.6666666666667" y="568.0" font-size="18" fill="#53635f" font-weight="400">列出支持和削弱不同解释的现象；原因图用于提问，记录缺</text>
<text x="1235.6666666666667" y="593.0" font-size="18" fill="#53635f" font-weight="400">失也不自动证明工作没发生。</text>
<polyline points="1205.6666666666667,530.0 1205.6666666666667,659.0 1223.6666666666667,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,645.0 1224.6666666666667,742.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="667.0" font-size="21" fill="#286f64" font-weight="700">局部加速与整体结果</text>
<text x="1235.6666666666667" y="697.0" font-size="18" fill="#233734" font-weight="400">某一步更快是否移动最终时点取决于实际依赖；固定开始时</text>
<text x="1235.6666666666667" y="722.0" font-size="18" fill="#233734" font-weight="400">点可能只让后续等待更长。</text>
<polyline points="1205.6666666666667,659.0 1205.6666666666667,788.0 1223.6666666666667,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="796.0" font-size="21" fill="#233734" font-weight="700">信息清楚与办理更快</text>
<text x="1235.6666666666667" y="826.0" font-size="18" fill="#53635f" font-weight="400">可靠进度可减少不确定感而未必提前维修；两种价值需分别</text>
<text x="1235.6666666666667" y="851.0" font-size="18" fill="#53635f" font-weight="400">观察，不能互相冒充。</text>
<text x="64" y="1044.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1044.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1069.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1102.0" font-size="21" fill="#233734" font-weight="700">资源争用与到达节奏</text>
<rect x="750" y="1069.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1102.0" font-size="21" fill="#233734" font-weight="700">等待时间</text>
<polyline points="538,1106.0 736,1106.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1106.0 726.9955289764732,1110.3496553411123 726.9955289764732,1101.6503446588877" fill="#286f64"/>
<text x="603.0" y="1094.0" font-size="17" fill="#286f64" font-weight="400">可能增加</text>
<text x="80" y="1152.0" font-size="18" fill="#53635f" font-weight="400">工作量和单件处理时间相同，集中到达仍可能形成更长队列。</text>
<rect x="64" y="1192.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1225.2" font-size="21" fill="#233734" font-weight="700">返工与新信息</text>
<rect x="750" y="1192.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1225.2" font-size="21" fill="#233734" font-weight="700">等待时间</text>
<polyline points="538,1229.2 736,1229.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1229.2 726.9955289764732,1233.5496553411124 726.9955289764732,1224.8503446588877" fill="#286f64"/>
<text x="603.0" y="1217.2" font-size="17" fill="#286f64" font-weight="400">可能重入</text>
<text x="80" y="1275.2" font-size="18" fill="#53635f" font-weight="400">补字段只花一分钟不代表业务仅延误一分钟，重新排队可能更久。</text>
<rect x="64" y="1315.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1348.4" font-size="21" fill="#233734" font-weight="700">局部加速与整体结果</text>
<rect x="750" y="1315.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1348.4" font-size="21" fill="#233734" font-weight="700">经过时间</text>
<polyline points="538,1352.4 736,1352.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1352.4 726.9955289764732,1356.7496553411124 726.9955289764732,1348.0503446588878" fill="#286f64"/>
<text x="586.0" y="1340.4" font-size="17" fill="#286f64" font-weight="400">依赖起止关系</text>
<text x="80" y="1398.4" font-size="18" fill="#53635f" font-weight="400">相加只适用于无遗漏且顺序成立的路线，不宜把局部省时直接当整体缩短。</text>
<rect x="64" y="1438.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1471.6000000000001" font-size="21" fill="#233734" font-weight="700">原因假设与区分观察</text>
<rect x="750" y="1438.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1471.6000000000001" font-size="21" fill="#233734" font-weight="700">交接缺口</text>
<polyline points="538,1475.6000000000001 736,1475.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1475.6000000000001 726.9955289764732,1479.9496553411125 726.9955289764732,1471.2503446588878" fill="#286f64"/>
<text x="586.0" y="1463.6000000000001" font-size="17" fill="#286f64" font-weight="400">检验是否存在</text>
<text x="80" y="1521.6000000000001" font-size="18" fill="#53635f" font-weight="400">长等待定位了区间，还须分辨未承接、容量占满或固定批次等解释。</text>
<polyline points="64,1579.8000000000002 1736,1579.8000000000002" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1609.8000000000002" font-size="17" fill="#53635f" font-weight="400">对照正文：P05  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1729" width="1800" height="1729" role="img" aria-labelledby="title">
<title id="title">配置、网络与持久数据</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1729" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">F / 交付、观察与恢复</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">F03  配置、网络与持久数据</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">以 F02 镜像启动服务；连接 B 的 HTTP 地址与 C 的数据文件，为 F04 探针和 F05 恢复界定位置。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">Compose 分别声明进程设置、网络连接和存储挂载；声明成立还要靠实际运行核对。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="718.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">一次运行如何接上请求和数据</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">声明如何成为进程设置</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="575.0" font-size="21" fill="#233734" font-weight="700">环境变量与启动读取</text>
<text x="103.0" y="605.0" font-size="18" fill="#53635f" font-weight="400">进程读取文字配置并验证类型后选择角色、地址和端口；修</text>
<text x="103.0" y="630.0" font-size="18" fill="#53635f" font-weight="400">改声明不会改掉已读取的旧环境。</text>
<polyline points="73.0,567.0 73.0,696.0 91.0,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,682.0 92.0,779.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="704.0" font-size="21" fill="#286f64" font-weight="700">多服务运行声明（Compose）</text>
<text x="103.0" y="734.0" font-size="18" fill="#233734" font-weight="400">YAML 描述服务及其镜像、环境、网络和挂载关系；它是数</text>
<text x="103.0" y="759.0" font-size="18" fill="#233734" font-weight="400">据声明，不是逐行执行脚本。</text>
<polyline points="73.0,696.0 73.0,825.0 91.0,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="833.0" font-size="21" fill="#233734" font-weight="700">插值与环境注入</text>
<text x="103.0" y="863.0" font-size="18" fill="#53635f" font-weight="400">主机 .env 可用于替换 Compose 变量，进程环境由默认值和</text>
<text x="103.0" y="888.0" font-size="18" fill="#53635f" font-weight="400">注入覆盖决定；放文件不等于全部传入。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">网络地址所在的位置</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,553.0 658.3333333333334,650.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#286f64" font-weight="700">发布端口与应用监听</text>
<text x="669.3333333333334" y="605.0" font-size="18" fill="#233734" font-weight="400">主机地址端口转到容器端口，再由进程监听接收；发布存在</text>
<text x="669.3333333333334" y="630.0" font-size="18" fill="#233734" font-weight="400">或 EXPOSE 声明都不证明监听可达。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,696.0 657.3333333333334,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="704.0" font-size="21" fill="#233734" font-weight="700">监听地址边界（localhost / 0.0.0.0）</text>
<text x="669.3333333333334" y="734.0" font-size="18" fill="#53635f" font-weight="400">localhost 指当前网络空间自身，0.0.0.0 表示该空间各接口监</text>
<text x="669.3333333333334" y="759.0" font-size="18" fill="#53635f" font-weight="400">听；主机与各容器不是同一位置。</text>
<polyline points="639.3333333333334,696.0 639.3333333333334,825.0 657.3333333333334,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="833.0" font-size="21" fill="#233734" font-weight="700">服务发现与内部地址（DNS）</text>
<text x="669.3333333333334" y="863.0" font-size="18" fill="#53635f" font-weight="400">同一 Compose 网络按名称找当前服务实例，使用内部端</text>
<text x="669.3333333333334" y="888.0" font-size="18" fill="#53635f" font-weight="400">口；实例 IP 可变，旧连接仍需处理失败。</text>
<polyline points="639.3333333333334,825.0 639.3333333333334,954.0 657.3333333333334,954.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="932.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="962.0" font-size="21" fill="#233734" font-weight="700">服务启动依赖与健康条件（depends_on）</text>
<text x="669.3333333333334" y="992.0" font-size="18" fill="#53635f" font-weight="400">可让初次启动等待指定服务健康，稳定起点；依赖存活检查</text>
<text x="669.3333333333334" y="1017.0" font-size="18" fill="#53635f" font-weight="400">不保证其后业务能力一直可用。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">声明与结果的核对</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#233734" font-weight="700">解析、启动与主机检查</text>
<text x="1235.6666666666667" y="605.0" font-size="18" fill="#53635f" font-weight="400">config 可解析、实例启动健康、主机端口可达是不同证据；</text>
<text x="1235.6666666666667" y="630.0" font-size="18" fill="#53635f" font-weight="400">任一步失败不应继续业务写入。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,696.0 1223.6666666666667,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="704.0" font-size="21" fill="#233734" font-weight="700">替换后的旧记录读回</text>
<text x="1235.6666666666667" y="734.0" font-size="18" fill="#53635f" font-weight="400">核对新容器身份与同一挂载，再读原工单字段；新建成功不</text>
<text x="1235.6666666666667" y="759.0" font-size="18" fill="#53635f" font-weight="400">能证明旧数据跨实例保留。</text>
<text x="64" y="1081.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1081.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1106.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1139.0" font-size="21" fill="#233734" font-weight="700">插值与环境注入</text>
<rect x="750" y="1106.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1139.0" font-size="21" fill="#233734" font-weight="700">环境变量与启动读取</text>
<polyline points="538,1143.0 736,1143.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1143.0 726.9955289764732,1147.3496553411123 726.9955289764732,1138.6503446588877" fill="#286f64"/>
<text x="603.0" y="1131.0" font-size="17" fill="#286f64" font-weight="400">共同影响</text>
<text x="80" y="1189.0" font-size="18" fill="#53635f" font-weight="400">应用使用最终进入进程的值，不能仅凭主机目录里有 .env 推断配置已经生效。</text>
<rect x="64" y="1229.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1262.2" font-size="21" fill="#233734" font-weight="700">监听地址边界（localhost / 0.0.0.0）</text>
<rect x="750" y="1229.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1262.2" font-size="21" fill="#233734" font-weight="700">发布端口与应用监听</text>
<polyline points="538,1266.2 736,1266.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1266.2 726.9955289764732,1270.5496553411124 726.9955289764732,1261.8503446588877" fill="#286f64"/>
<text x="577.5" y="1254.2" font-size="17" fill="#286f64" font-weight="400">决定监听可达性</text>
<text x="80" y="1312.2" font-size="18" fill="#53635f" font-weight="400">容器只监听自身 loopback 时，主机转发到网络接口仍可能找不到服务。</text>
<rect x="64" y="1352.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1385.4" font-size="21" fill="#233734" font-weight="700">多服务运行声明（Compose）</text>
<rect x="750" y="1352.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1385.4" font-size="21" fill="#233734" font-weight="700">环境变量与启动读取</text>
<polyline points="538,1389.4 736,1389.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1389.4 726.9955289764732,1393.7496553411124 726.9955289764732,1385.0503446588878" fill="#286f64"/>
<text x="569.0" y="1377.4" font-size="17" fill="#286f64" font-weight="400">声明本次进程设置</text>
<text x="80" y="1435.4" font-size="18" fill="#53635f" font-weight="400">Compose 注入的值仍需代码读取并校验；改配置后需替换实例而非期待既有进程自动变化。</text>
<rect x="64" y="1475.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1508.6000000000001" font-size="21" fill="#233734" font-weight="700">多服务运行声明（Compose）</text>
<rect x="750" y="1475.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1508.6000000000001" font-size="21" fill="#233734" font-weight="700">服务发现与内部地址（DNS）</text>
<polyline points="538,1512.6000000000001 736,1512.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1512.6000000000001 726.9955289764732,1516.9496553411125 726.9955289764732,1508.2503446588878" fill="#286f64"/>
<text x="560.5" y="1500.6000000000001" font-size="17" fill="#286f64" font-weight="400">在共同网络提供名称</text>
<text x="80" y="1558.6000000000001" font-size="18" fill="#53635f" font-weight="400">服务名用于定位网络中的服务；地址变化后，已经断开的连接仍需应用妥善处理。</text>
<text x="64" y="1610.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：文件写在哪里。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1673.4 1736,1673.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1703.4" font-size="17" fill="#53635f" font-weight="400">对照正文：F03  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
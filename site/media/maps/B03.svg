<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1817" width="1800" height="1817" role="img" aria-labelledby="title">
<title id="title">客户端与可用回应</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1817" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">B / HTTP 与 API</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">B03  客户端与可用回应</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">接续 B01 的状态和内容区别，给 B04 的服务内调用提供清晰的成功值与失败类型。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">拿到回应、状态允许继续、内容满足用途，是三件事；全部通过才把本次摘要交给后续代码。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="690.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">客户端调用、结果合同与失败分类</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">请求构造与资源</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="575.0" font-size="21" fill="#233734" font-weight="700">客户端请求参数（HTTPX）</text>
<text x="103.0" y="605.0" font-size="18" fill="#53635f" font-weight="400">地址、查询参数、JSON正文和消息头各有对应参数；同为关</text>
<text x="103.0" y="630.0" font-size="18" fill="#53635f" font-weight="400">键字参数也不能互换HTTP位置。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">回应的不同事实</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,553.0 658.3333333333334,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#286f64" font-weight="700">服务回应对象（Response）</text>
<text x="669.3333333333334" y="605.0" font-size="16" fill="#286f64" font-weight="400">本地响应对象</text>
<text x="669.3333333333334" y="627.0" font-size="18" fill="#233734" font-weight="400">提供status、headers及正文；text只是解码文字，json方法才</text>
<text x="669.3333333333334" y="652.0" font-size="18" fill="#233734" font-weight="400">尝试解析，取得对象仍非业务成功。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,718.0 657.3333333333334,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="696.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="726.0" font-size="21" fill="#233734" font-weight="700">回应结果检查（HTTP状态）</text>
<text x="669.3333333333334" y="756.0" font-size="16" fill="#286f64" font-weight="400">检查动作</text>
<text x="669.3333333333334" y="778.0" font-size="18" fill="#53635f" font-weight="400">raise_for_status拒绝非2xx；精确200或201合同需另比，默认</text>
<text x="669.3333333333334" y="803.0" font-size="18" fill="#53635f" font-weight="400">不跟随重定向。</text>
<polyline points="639.3333333333334,718.0 639.3333333333334,869.0 657.3333333333334,869.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="847.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="877.0" font-size="21" fill="#233734" font-weight="700">媒体类型合同</text>
<text x="669.3333333333334" y="907.0" font-size="18" fill="#53635f" font-weight="400">本例去参数、空白并统一大小写后要求application/json；这</text>
<text x="669.3333333333334" y="932.0" font-size="18" fill="#53635f" font-weight="400">不是禁止其他接口采用+json类型。</text>
<polyline points="639.3333333333334,869.0 639.3333333333334,998.0 657.3333333333334,998.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="976.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,984.0 658.3333333333334,1081.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="1006.0" font-size="21" fill="#286f64" font-weight="700">正文结构与字段检查（JSON）</text>
<text x="669.3333333333334" y="1036.0" font-size="18" fill="#233734" font-weight="400">解析后检查object、summary字符串与去空白非空；语法成</text>
<text x="669.3333333333334" y="1061.0" font-size="18" fill="#233734" font-weight="400">功不保证顶层类型和字段可用。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">失败与返回边界</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#233734" font-weight="700">传输失败</text>
<text x="1235.6666666666667" y="605.0" font-size="16" fill="#286f64" font-weight="400">失败类别</text>
<text x="1235.6666666666667" y="627.0" font-size="18" fill="#53635f" font-weight="400">请求错误表示未取得完整可用回应，超时是其子类；应先捕</text>
<text x="1235.6666666666667" y="652.0" font-size="18" fill="#53635f" font-weight="400">获超时，不能据此判定对方未执行。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,718.0 1223.6666666666667,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="696.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="726.0" font-size="21" fill="#233734" font-weight="700">状态失败</text>
<text x="1235.6666666666667" y="756.0" font-size="16" fill="#286f64" font-weight="400">失败类别</text>
<text x="1235.6666666666667" y="778.0" font-size="18" fill="#53635f" font-weight="400">完整回应已取得，但 HTTP 状态不满足成功要求；与尚未取</text>
<text x="1235.6666666666667" y="803.0" font-size="18" fill="#53635f" font-weight="400">得完整回应的传输失败不同。</text>
<polyline points="1205.6666666666667,718.0 1205.6666666666667,869.0 1223.6666666666667,869.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="847.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="877.0" font-size="21" fill="#233734" font-weight="700">内容失败</text>
<text x="1235.6666666666667" y="907.0" font-size="16" fill="#286f64" font-weight="400">失败类别</text>
<text x="1235.6666666666667" y="929.0" font-size="18" fill="#53635f" font-weight="400">成功状态之后，媒体类型、JSON 或字段不合约；未获得可</text>
<text x="1235.6666666666667" y="954.0" font-size="18" fill="#53635f" font-weight="400">用摘要，不应误报为传输失败。</text>
<polyline points="1205.6666666666667,869.0 1205.6666666666667,1020.0 1223.6666666666667,1020.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="998.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,1006.0 1224.6666666666667,1125.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="1028.0" font-size="21" fill="#286f64" font-weight="700">适配层失败分类（adapter异常）</text>
<text x="1235.6666666666667" y="1058.0" font-size="16" fill="#286f64" font-weight="400">应用边界的失败类别</text>
<text x="1235.6666666666667" y="1080.0" font-size="18" fill="#233734" font-weight="400">SupplierClient统一请求及检查，将底层失败翻译为明确类</text>
<text x="1235.6666666666667" y="1105.0" font-size="18" fill="#233734" font-weight="400">别，并保留原始原因供定位。</text>
<text x="64" y="1169.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1169.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1194.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1227.0" font-size="21" fill="#233734" font-weight="700">服务回应对象（Response）</text>
<rect x="750" y="1194.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1227.0" font-size="21" fill="#233734" font-weight="700">回应结果检查（HTTP状态）</text>
<polyline points="538,1231.0 736,1231.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1231.0 726.9955289764732,1235.3496553411123 726.9955289764732,1226.6503446588877" fill="#286f64"/>
<text x="577.5" y="1219.0" font-size="17" fill="#286f64" font-weight="400">先检查处理状态</text>
<text x="80" y="1277.0" font-size="18" fill="#53635f" font-weight="400">Response 提供收到的事实；503 也有 Response，不能直接当摘要使用。</text>
<rect x="64" y="1317.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1350.2" font-size="21" fill="#233734" font-weight="700">回应结果检查（HTTP状态）</text>
<rect x="750" y="1317.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1350.2" font-size="21" fill="#233734" font-weight="700">媒体类型合同</text>
<polyline points="538,1354.2 736,1354.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1354.2 726.9955289764732,1358.5496553411124 726.9955289764732,1349.8503446588877" fill="#286f64"/>
<text x="577.5" y="1342.2" font-size="17" fill="#286f64" font-weight="400">通过后仍须检查</text>
<text x="80" y="1400.2" font-size="18" fill="#53635f" font-weight="400">本例先接受成功类状态，再检查约定的 application/json，失败状态也可能带合法 JSON。</text>
<rect x="64" y="1440.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1473.4" font-size="21" fill="#233734" font-weight="700">媒体类型合同</text>
<rect x="750" y="1440.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1473.4" font-size="21" fill="#233734" font-weight="700">正文结构与字段检查（JSON）</text>
<polyline points="538,1477.4 736,1477.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1477.4 726.9955289764732,1481.7496553411124 726.9955289764732,1473.0503446588878" fill="#286f64"/>
<text x="586.0" y="1465.4" font-size="17" fill="#286f64" font-weight="400">仍须解析校验</text>
<text x="80" y="1523.4" font-size="18" fill="#53635f" font-weight="400">顶层是字典、摘要是字符串且去空白后非空，才可返回本次摘要。</text>
<rect x="64" y="1563.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1596.6000000000001" font-size="21" fill="#233734" font-weight="700">状态失败</text>
<rect x="750" y="1563.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1596.6000000000001" font-size="21" fill="#233734" font-weight="700">内容失败</text>
<polyline points="538,1600.6000000000001 736,1600.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1600.6000000000001 726.9955289764732,1604.9496553411125 726.9955289764732,1596.2503446588878" fill="#286f64"/>
<text x="611.5" y="1588.6000000000001" font-size="17" fill="#286f64" font-weight="400">不同于</text>
<text x="80" y="1646.6000000000001" font-size="18" fill="#53635f" font-weight="400">一处是 HTTP 结果不合成功要求，另一处是成功状态后仍没有可用内容，恢复位置不同。</text>
<text x="64" y="1698.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：可重复的边界测试；连接复用与等待范围。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1761.4 1736,1761.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1791.4" font-size="17" fill="#53635f" font-weight="400">对照正文：B03  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
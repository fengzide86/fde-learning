<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1622" width="1800" height="1622" role="img" aria-labelledby="title">
<title id="title">检索与回答依据</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1622" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">E / 受约束的 AI 应用</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">E04  检索与回答依据</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">在 E03 实际输入中补上业务资料；连接 C 的过滤和 E02 的核对，不把引用当执行权限。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">先找到获准且适用的资料，再生成并核对主张；相似或有引用都不能代替依据。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="746.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">让生成答案可追溯到原文</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">资料准备与适用范围</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="575.0" font-size="21" fill="#233734" font-weight="700">资料准备与版本（ingestion）</text>
<text x="103.0" y="605.0" font-size="18" fill="#53635f" font-weight="400">确认来源和使用范围，提取原文并建索引；新版导入还要处</text>
<text x="103.0" y="630.0" font-size="18" fill="#53635f" font-weight="400">理旧片段退出，不能只追加。</text>
<polyline points="73.0,567.0 73.0,696.0 91.0,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="704.0" font-size="21" fill="#233734" font-weight="700">切分资料并保留上下文（chunk / overlap）</text>
<text x="103.0" y="734.0" font-size="18" fill="#53635f" font-weight="400">以可理解的规则边界分块，必要时重叠保留条件；仅按字符</text>
<text x="103.0" y="759.0" font-size="18" fill="#53635f" font-weight="400">切割可能拆掉动作前提。</text>
<polyline points="73.0,696.0 73.0,825.0 91.0,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,811.0 92.0,908.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="833.0" font-size="21" fill="#286f64" font-weight="700">资料属性筛选（metadata）</text>
<text x="103.0" y="863.0" font-size="18" fill="#233734" font-weight="400">用角色、类别、日期和来源限制可取资料；授权过滤须发生</text>
<text x="103.0" y="888.0" font-size="18" fill="#233734" font-weight="400">在把内容交给模型以前。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">生成与引用的支持关系</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,553.0 658.3333333333334,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#286f64" font-weight="700">资料检索后生成（RAG）</text>
<text x="669.3333333333334" y="605.0" font-size="16" fill="#286f64" font-weight="400">检索后生成的方法</text>
<text x="669.3333333333334" y="627.0" font-size="18" fill="#233734" font-weight="400">检索片段进入本次上下文后辅助生成；改变可见输入，不等</text>
<text x="669.3333333333334" y="652.0" font-size="18" fill="#233734" font-weight="400">于将资料训练进模型参数。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,718.0 657.3333333333334,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="726.0" font-size="21" fill="#233734" font-weight="700">引用集合核对</text>
<text x="669.3333333333334" y="756.0" font-size="18" fill="#53635f" font-weight="400">检查非空引用确属本次取回片段；编号存在只证明可追踪，</text>
<text x="669.3333333333334" y="781.0" font-size="18" fill="#53635f" font-weight="400">不证明回答受到内容支持。</text>
<polyline points="639.3333333333334,718.0 639.3333333333334,847.0 657.3333333333334,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,833.0 658.3333333333334,930.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="855.0" font-size="21" fill="#286f64" font-weight="700">主张与条件核对</text>
<text x="669.3333333333334" y="885.0" font-size="18" fill="#233734" font-weight="400">判断原文是否支持回答并保留必要条件；窄短语检查不能证</text>
<text x="669.3333333333334" y="910.0" font-size="18" fill="#233734" font-weight="400">明任意自然语言都正确。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">不可信输入与失败定位</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#233734" font-weight="700">间接提示注入</text>
<text x="1235.6666666666667" y="605.0" font-size="18" fill="#53635f" font-weight="400">资料中夹带的命令仍是数据；模式拦截有限，须由应用限制</text>
<text x="1235.6666666666667" y="630.0" font-size="18" fill="#53635f" font-weight="400">资料、工具和执行权限。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,696.0 1223.6666666666667,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="704.0" font-size="21" fill="#233734" font-weight="700">无依据与分层诊断</text>
<text x="1235.6666666666667" y="734.0" font-size="18" fill="#53635f" font-weight="400">资料不足时停止回答；沿原文、索引、过滤、输入和候选找</text>
<text x="1235.6666666666667" y="759.0" font-size="18" fill="#53635f" font-weight="400">最早缺口，再选择修复位置。</text>
<text x="64" y="974.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="974.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="999.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1032.0" font-size="21" fill="#233734" font-weight="700">切分资料并保留上下文（chunk / overlap）</text>
<rect x="750" y="999.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1032.0" font-size="21" fill="#233734" font-weight="700">主张与条件核对</text>
<polyline points="538,1036.0 736,1036.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1036.0 726.9955289764732,1040.3496553411123 726.9955289764732,1031.6503446588877" fill="#286f64"/>
<text x="586.0" y="1024.0" font-size="17" fill="#286f64" font-weight="400">保留所需条件</text>
<text x="80" y="1082.0" font-size="18" fill="#53635f" font-weight="400">若切块已丢掉前提，后续生成和引用编号都补不回原始依据。</text>
<rect x="64" y="1122.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1155.2" font-size="21" fill="#233734" font-weight="700">引用集合核对</text>
<rect x="750" y="1122.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1155.2" font-size="21" fill="#233734" font-weight="700">主张与条件核对</text>
<polyline points="538,1159.2 736,1159.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1159.2 726.9955289764732,1163.5496553411124 726.9955289764732,1154.8503446588877" fill="#286f64"/>
<text x="603.0" y="1147.2" font-size="17" fill="#286f64" font-weight="400">不能替代</text>
<text x="80" y="1205.2" font-size="18" fill="#53635f" font-weight="400">真实引用仍可能被误解、反转条件或引用不可靠来源。</text>
<rect x="64" y="1245.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1278.4" font-size="21" fill="#233734" font-weight="700">无依据与分层诊断</text>
<rect x="750" y="1245.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1278.4" font-size="21" fill="#233734" font-weight="700">资料检索后生成（RAG）</text>
<polyline points="538,1282.4 736,1282.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1282.4 726.9955289764732,1286.7496553411124 726.9955289764732,1278.0503446588878" fill="#286f64"/>
<text x="586.0" y="1270.4" font-size="17" fill="#286f64" font-weight="400">检查最早缺口</text>
<text x="80" y="1328.4" font-size="18" fill="#53635f" font-weight="400">修资料、过滤或输入的问题，不能统一用增加生成次数解决。</text>
<rect x="64" y="1368.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1401.6000000000001" font-size="21" fill="#233734" font-weight="700">资料准备与版本（ingestion）</text>
<rect x="750" y="1368.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1401.6000000000001" font-size="21" fill="#233734" font-weight="700">资料检索后生成（RAG）</text>
<polyline points="538,1405.6000000000001 736,1405.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1405.6000000000001 726.9955289764732,1409.9496553411125 726.9955289764732,1401.2503446588878" fill="#286f64"/>
<text x="577.5" y="1393.6000000000001" font-size="17" fill="#286f64" font-weight="400">提供可检索资料</text>
<text x="80" y="1451.6000000000001" font-size="18" fill="#53635f" font-weight="400">先登记资料版本与适用范围，再按当前任务取回材料；这不是把资料训练进模型。</text>
<text x="64" y="1503.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：查找与表示。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1566.4 1736,1566.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1596.4" font-size="17" fill="#53635f" font-weight="400">对照正文：E04  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1467" width="1800" height="1467" role="img" aria-labelledby="title">
<title id="title">构建输入与运行模板</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1467" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">F / 交付、观察与恢复</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">F02  构建输入与运行模板</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">在 F01 的镜像与实例关系上解释构建；为 F03 配置以及 F05 精确版本恢复留下可辨认对象。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">这里单独展开另一组关系，便于看清归属与交接；分面本身不表示选修或可以省略。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">续图 · 与主图共同构成本章关系</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="705.6201171875" y="386.0" font-size="28" fill="#286f64" font-weight="700">构建说明如何定义可识别产物（Dockerfile）</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="900.0,437.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="1672.0" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">构建复用、产物身份与更新</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="1633.0" height="88" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="575.0" font-size="21" fill="#233734" font-weight="700">镜像层与构建缓存（layers / build cache）</text>
<text x="103.0" y="605.0" font-size="18" fill="#53635f" font-weight="400">层保存文件变化，缓存复用相同输入的中间结果；先复制依赖可减少仅改源码时的重复安装。</text>
<polyline points="73.0,567.0 73.0,671.0 91.0,671.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="649.0" width="1633.0" height="88" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="679.0" font-size="21" fill="#233734" font-weight="700">版本标签、内容摘要与镜像身份（tag / digest / image ID）</text>
<text x="103.0" y="709.0" font-size="18" fill="#53635f" font-weight="400">tag 可移动，digest 固定指定内容；base 身份不能替代包含应用源码的最终镜像身份。</text>
<polyline points="73.0,671.0 73.0,775.0 91.0,775.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="753.0" width="1633.0" height="88" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="783.0" font-size="21" fill="#233734" font-weight="700">禁用缓存与重新拉取（no-cache / pull）</text>
<text x="103.0" y="813.0" font-size="18" fill="#53635f" font-weight="400">前者控制缓存复用，后者尝试取得指定基础引用；固定 digest 时 pull 不会替你选择新版。</text>
<polyline points="73.0,775.0 73.0,879.0 91.0,879.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="857.0" width="1633.0" height="88" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="887.0" font-size="21" fill="#233734" font-weight="700">重建、重新创建与重启（rebuild / recreate / restart）</text>
<text x="103.0" y="917.0" font-size="18" fill="#53635f" font-weight="400">改源码需重建镜像并换实例，改运行配置需重建实例；重启同一实例仍用原镜像和原配置。</text>
<text x="64" y="981.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="981.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1006.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1039.0" font-size="21" fill="#233734" font-weight="700">版本标签、内容摘要与镜像身份（tag / digest / image ID）</text>
<rect x="750" y="1006.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1039.0" font-size="21" fill="#233734" font-weight="700">重建、重新创建与重启（rebuild / recreate / restart）</text>
<polyline points="538,1043.0 736,1043.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1043.0 726.9955289764732,1047.3496553411123 726.9955289764732,1038.6503446588877" fill="#286f64"/>
<text x="586.0" y="1031.0" font-size="17" fill="#286f64" font-weight="400">提供精确参照</text>
<text x="80" y="1089.0" font-size="18" fill="#53635f" font-weight="400">新产物需用实际身份核对；构建完成不会自动把既有实例换成新镜像。</text>
<rect x="64" y="1129.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1162.2" font-size="21" fill="#233734" font-weight="700">构建参数与运行默认值（ARG / ENV，见主图）</text>
<rect x="750" y="1129.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1162.2" font-size="21" fill="#233734" font-weight="700">重建、重新创建与重启（rebuild / recreate / restart）</text>
<polyline points="538,1166.2 736,1166.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1166.2 726.9955289764732,1170.5496553411124 726.9955289764732,1161.8503446588877" fill="#286f64"/>
<text x="586.0" y="1154.2" font-size="17" fill="#286f64" font-weight="400">改变时需选择</text>
<text x="80" y="1212.2" font-size="18" fill="#53635f" font-weight="400">镜像默认值与本次配置所在位置不同，应按真正改变的对象选择动作。</text>
<rect x="64" y="1252.4" width="460" height="76" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1285.4" font-size="21" fill="#233734" font-weight="700">禁用缓存与重新拉取（no-cache / pull）</text>
<rect x="750" y="1252.4" width="986" height="76" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1285.4" font-size="21" fill="#233734" font-weight="700">镜像层与构建缓存（layers / build cache）</text>
<polyline points="538,1298.4 736,1298.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1298.4 726.9955289764732,1302.7496553411124 726.9955289764732,1294.0503446588878" fill="#286f64"/>
<text x="546.54638671875" y="1263.4" font-size="17" fill="#286f64" font-weight="400">只在 no-cache 一侧控制</text>
<text x="620.0" y="1286.4" font-size="17" fill="#286f64" font-weight="400">复用</text>
<text x="80" y="1353.4" font-size="18" fill="#53635f" font-weight="400">不用缓存与尝试取得基础引用是两个动作；既不能互相替代，也不自动更新固定 digest。</text>
<polyline points="64,1411.6000000000001 1736,1411.6000000000001" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1441.6000000000001" font-size="17" fill="#53635f" font-weight="400">对照正文：F02  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
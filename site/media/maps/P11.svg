<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1635" width="1800" height="1635" role="img" aria-labelledby="title">
<title id="title">采用、接手与暂停</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1635" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">P / 产品与业务</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">P11  采用、接手与暂停</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">将 P10 的有界试行放进实际责任与资源；为 P12 解释过程记录、客户结果和额外负担准备条件。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">上线只是入口，持续采用要有人承担工作；失败时应交出能被真正接续的事实和责任。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="760.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">让新办法进入持续工作</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 1466.3333333333335,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 333.6666666666667,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">采用的实际条件</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,516.0 92.0,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="538.0" font-size="21" fill="#286f64" font-weight="700">持续采用</text>
<text x="103.0" y="568.0" font-size="18" fill="#233734" font-weight="400">相关人员能够持续用新办法完成必要工作；登录、打开页面</text>
<text x="103.0" y="593.0" font-size="18" fill="#233734" font-weight="400">或参加培训不能代替实际采用。</text>
<polyline points="73.0,530.0 73.0,659.0 91.0,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="667.0" font-size="21" fill="#233734" font-weight="700">工作负担与激励</text>
<text x="103.0" y="697.0" font-size="18" fill="#53635f" font-weight="400">核对重复录入、时间、信息、权限和考核冲突；不愿使用可</text>
<text x="103.0" y="722.0" font-size="18" fill="#53635f" font-weight="400">能反映现实条件，而非态度问题。</text>
<polyline points="73.0,659.0 73.0,788.0 91.0,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="796.0" font-size="21" fill="#233734" font-weight="700">角色决定与情境训练</text>
<text x="103.0" y="826.0" font-size="18" fill="#53635f" font-weight="400">预算、数据授权、维护责任分别确认，培训覆盖缺记录、过</text>
<text x="103.0" y="851.0" font-size="18" fill="#53635f" font-weight="400">期、取消等路线，不只演示顺利操作。</text>
<polyline points="900.0,400.0 900.0,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="465.0" font-size="23" fill="#286f64" font-weight="700">承接与运行观察</text>
<polyline points="639.3333333333334,488.0 639.3333333333334,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,488.0 639.3333333333334,530.0 657.3333333333334,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="538.0" font-size="21" fill="#233734" font-weight="700">试用记录与缺失证据</text>
<text x="669.3333333333334" y="568.0" font-size="18" fill="#53635f" font-weight="400">记录承接、有效更新和重复联系；缺记录可能是未做、漏记</text>
<text x="669.3333333333334" y="593.0" font-size="18" fill="#53635f" font-weight="400">或丢失，重叠也不直接证明因果。</text>
<polyline points="639.3333333333334,530.0 639.3333333333334,659.0 657.3333333333334,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,645.0 658.3333333333334,742.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="667.0" font-size="21" fill="#286f64" font-weight="700">发送方与接收方责任</text>
<text x="669.3333333333334" y="697.0" font-size="18" fill="#233734" font-weight="400">发出请求不让原责任自动消失；明确承接及后续说明岗位，</text>
<text x="669.3333333333334" y="722.0" font-size="18" fill="#233734" font-weight="400">等待仍须有人持续负责。</text>
<polyline points="639.3333333333334,659.0 639.3333333333334,788.0 657.3333333333334,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="766.0" width="500.33333333333337" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="796.0" font-size="21" fill="#233734" font-weight="700">首次回应与后续更新</text>
<text x="669.3333333333334" y="826.0" font-size="18" fill="#53635f" font-weight="400">本册约定工作时段求助后30分钟内人工说明已知、缺口和下</text>
<text x="669.3333333333334" y="851.0" font-size="18" fill="#53635f" font-weight="400">一步；不是自动收悉或修好承诺。后续更新另有检查点，非</text>
<text x="669.3333333333334" y="876.0" font-size="18" fill="#53635f" font-weight="400">工作时段不自动进入同一指标分母。</text>
<polyline points="1466.3333333333335,400.0 1466.3333333333335,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="465.0" font-size="23" fill="#286f64" font-weight="700">例外与有界暂停</text>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,530.0 1223.6666666666667,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,516.0 1224.6666666666667,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="538.0" font-size="21" fill="#286f64" font-weight="700">可接续的人工出口</text>
<text x="1235.6666666666667" y="568.0" font-size="18" fill="#233734" font-weight="400">交出求助、已知未知、已做动作与可能效果，并明确接手权</text>
<text x="1235.6666666666667" y="593.0" font-size="18" fill="#233734" font-weight="400">限、确认和升级；转人工文字本身无效。</text>
<polyline points="1205.6666666666667,530.0 1205.6666666666667,659.0 1223.6666666666667,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="667.0" font-size="21" fill="#233734" font-weight="700">结果未知与效果核查</text>
<text x="1235.6666666666667" y="697.0" font-size="18" fill="#53635f" font-weight="400">回复丢失不证明预约未成立；先查已有业务结果，再决定是</text>
<text x="1235.6666666666667" y="722.0" font-size="18" fill="#53635f" font-weight="400">否重做，取消也不能抹除已发生后果。</text>
<polyline points="1205.6666666666667,659.0 1205.6666666666667,788.0 1223.6666666666667,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="796.0" font-size="21" fill="#233734" font-weight="700">暂停范围与在途事项</text>
<text x="1235.6666666666667" y="826.0" font-size="18" fill="#53635f" font-weight="400">按过期事实或无人承接的问题暂停相关行为；限制新案例</text>
<text x="1235.6666666666667" y="851.0" font-size="18" fill="#53635f" font-weight="400">时，已进入流程的客户仍须照顾。</text>
<polyline points="1205.6666666666667,788.0 1205.6666666666667,917.0 1223.6666666666667,917.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="895.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="925.0" font-size="21" fill="#233734" font-weight="700">恢复运行条件</text>
<text x="1235.6666666666667" y="955.0" font-size="18" fill="#53635f" font-weight="400">核对问题解除、人员接手、未完成事项可找回且不重复效</text>
<text x="1235.6666666666667" y="980.0" font-size="18" fill="#53635f" font-weight="400">果；页面恢复显示不足以证明业务恢复。</text>
<text x="64" y="1044.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1044.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1069.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1102.0" font-size="21" fill="#233734" font-weight="700">工作负担与激励</text>
<rect x="750" y="1069.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1102.0" font-size="21" fill="#233734" font-weight="700">持续采用</text>
<polyline points="538,1106.0 736,1106.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1106.0 726.9955289764732,1110.3496553411123 726.9955289764732,1101.6503446588877" fill="#286f64"/>
<text x="603.0" y="1094.0" font-size="17" fill="#286f64" font-weight="400">影响能否</text>
<text x="80" y="1152.0" font-size="18" fill="#53635f" font-weight="400">新旧流程叠加或权限缺口会使培训后的人员仍退回旧办法。</text>
<rect x="64" y="1192.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1225.2" font-size="21" fill="#233734" font-weight="700">试用记录与缺失证据</text>
<rect x="750" y="1192.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1225.2" font-size="21" fill="#233734" font-weight="700">发送方与接收方责任</text>
<polyline points="538,1229.2 736,1229.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1229.2 726.9955289764732,1233.5496553411124 726.9955289764732,1224.8503446588877" fill="#286f64"/>
<text x="603.0" y="1217.2" font-size="17" fill="#286f64" font-weight="400">提示核查</text>
<text x="80" y="1275.2" font-size="18" fill="#53635f" font-weight="400">没有承接记录先查工作和记录各在哪里断裂，不能直接给人员或系统定责。</text>
<rect x="64" y="1315.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1348.4" font-size="21" fill="#233734" font-weight="700">结果未知与效果核查</text>
<rect x="750" y="1315.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1348.4" font-size="21" fill="#233734" font-weight="700">可接续的人工出口</text>
<polyline points="538,1352.4 736,1352.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1352.4 726.9955289764732,1356.7496553411124 726.9955289764732,1348.0503446588878" fill="#286f64"/>
<text x="586.0" y="1340.4" font-size="17" fill="#286f64" font-weight="400">决定接手内容</text>
<text x="80" y="1398.4" font-size="18" fill="#53635f" font-weight="400">人工需要知道什么可能已发生，才能避免把未知结果重做成重复预约。</text>
<rect x="64" y="1438.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1471.6000000000001" font-size="21" fill="#233734" font-weight="700">暂停范围与在途事项</text>
<rect x="750" y="1438.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1471.6000000000001" font-size="21" fill="#233734" font-weight="700">恢复运行条件</text>
<polyline points="538,1475.6000000000001 736,1475.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1475.6000000000001 726.9955289764732,1479.9496553411125 726.9955289764732,1471.2503446588878" fill="#286f64"/>
<text x="586.0" y="1463.6000000000001" font-size="17" fill="#286f64" font-weight="400">保留恢复对象</text>
<text x="80" y="1521.6000000000001" font-size="18" fill="#53635f" font-weight="400">暂停自动行为不等于丢掉已有求助，恢复须核对遗留责任和业务效果。</text>
<polyline points="64,1579.8000000000002 1736,1579.8000000000002" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1609.8000000000002" font-size="17" fill="#53635f" font-weight="400">对照正文：P11  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
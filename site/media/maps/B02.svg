<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1773" width="1800" height="1773" role="img" aria-labelledby="title">
<title id="title">请求与 Python 函数</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1773" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">B / HTTP 与 API</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">B02  请求与 Python 函数</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">在 B01 的消息结构上解释服务端如何接入函数；B03再检查调用方实际收到的回应。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">输入检查、当前业务判断、公开结果检查位于不同位置；输入通过才交给函数，函数返回后仍须验证公开结果。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="718.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">服务端入口、校验与公开结果</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">运行与路由</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="575.0" font-size="21" fill="#233734" font-weight="700">服务运行与框架（Uvicorn / FastAPI）</text>
<text x="103.0" y="605.0" font-size="18" fill="#53635f" font-weight="400">Uvicorn加载应用并监听端口；FastAPI负责路由、输入和响</text>
<text x="103.0" y="630.0" font-size="18" fill="#53635f" font-weight="400">应，业务函数决定记录变化。</text>
<polyline points="73.0,567.0 73.0,696.0 91.0,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="674.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,682.0 92.0,801.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="704.0" font-size="21" fill="#286f64" font-weight="700">请求入口映射（route / endpoint）</text>
<text x="103.0" y="734.0" font-size="16" fill="#286f64" font-weight="400">入口登记与处理函数</text>
<text x="103.0" y="756.0" font-size="18" fill="#233734" font-weight="400">装饰器登记method和path到函数；登记不是执行，请求匹配</text>
<text x="103.0" y="781.0" font-size="18" fill="#233734" font-weight="400">后才调用endpoint。</text>
<polyline points="73.0,696.0 73.0,847.0 91.0,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="855.0" font-size="21" fill="#233734" font-weight="700">参数来源</text>
<text x="103.0" y="885.0" font-size="18" fill="#53635f" font-weight="400">path选目标，query调读取，body传结构输入；框架提供的</text>
<text x="103.0" y="910.0" font-size="18" fill="#53635f" font-weight="400">Response对象不来自请求字段。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">输入与当前事实</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,553.0 658.3333333333334,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#286f64" font-weight="700">输入数据形状（model）</text>
<text x="669.3333333333334" y="605.0" font-size="16" fill="#286f64" font-weight="400">输入结构声明</text>
<text x="669.3333333333334" y="627.0" font-size="18" fill="#233734" font-weight="400">Pydantic按字段类型、范围及必填规则处理输入；合法JSON</text>
<text x="669.3333333333334" y="652.0" font-size="18" fill="#233734" font-weight="400">不等于合法请求，默认可能转换值。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,718.0 657.3333333333334,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="726.0" font-size="21" fill="#233734" font-weight="700">业务存在性与版本</text>
<text x="669.3333333333334" y="756.0" font-size="18" fill="#53635f" font-weight="400">模型通过后仍需查目标和当前版本；本例404与409来自业务</text>
<text x="669.3333333333334" y="781.0" font-size="18" fill="#53635f" font-weight="400">判断，内存比较不保证并发原子性。</text>
<polyline points="639.3333333333334,718.0 639.3333333333334,847.0 657.3333333333334,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="855.0" font-size="21" fill="#233734" font-weight="700">公开失败回应（HTTPException）</text>
<text x="669.3333333333334" y="885.0" font-size="18" fill="#53635f" font-weight="400">中止当前正常路线，向框架交出失败状态与公开说明；只返</text>
<text x="669.3333333333334" y="910.0" font-size="18" fill="#53635f" font-weight="400">回错误字典不会自动产生404。</text>
<polyline points="639.3333333333334,847.0 639.3333333333334,976.0 657.3333333333334,976.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="954.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="984.0" font-size="21" fill="#233734" font-weight="700">进程内共享状态（app.state）</text>
<text x="669.3333333333334" y="1014.0" font-size="16" fill="#286f64" font-weight="400">应用内存状态</text>
<text x="669.3333333333334" y="1036.0" font-size="18" fill="#53635f" font-weight="400">持有当前应用的内存字典和资源；进程重启会丢失，</text>
<text x="669.3333333333334" y="1061.0" font-size="18" fill="#53635f" font-weight="400">create_app可为测试建立独立起点。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">公开合同</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,553.0 1224.6666666666667,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#286f64" font-weight="700">对外返回结构（response model）</text>
<text x="1235.6666666666667" y="605.0" font-size="16" fill="#286f64" font-weight="400">输出结构声明</text>
<text x="1235.6666666666667" y="627.0" font-size="18" fill="#233734" font-weight="400">函数返回后检查并过滤公开字段；不删除内部记录，也不自</text>
<text x="1235.6666666666667" y="652.0" font-size="18" fill="#233734" font-weight="400">动承担读取权限判断。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,718.0 1223.6666666666667,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="726.0" font-size="21" fill="#233734" font-weight="700">输入与输出校验错误</text>
<text x="1235.6666666666667" y="756.0" font-size="18" fill="#53635f" font-weight="400">本例输入失败默认422且不进endpoint；输出失败属于服务</text>
<text x="1235.6666666666667" y="781.0" font-size="18" fill="#53635f" font-weight="400">实现错误，可能在写入之后发生。</text>
<text x="64" y="1125.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1125.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1150.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1183.0" font-size="21" fill="#233734" font-weight="700">请求入口映射（route / endpoint）</text>
<rect x="750" y="1150.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1183.0" font-size="21" fill="#233734" font-weight="700">输入数据形状（model）</text>
<polyline points="538,1187.0 736,1187.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1187.0 726.9955289764732,1191.3496553411123 726.9955289764732,1182.6503446588877" fill="#286f64"/>
<text x="543.5" y="1175.0" font-size="17" fill="#286f64" font-weight="400">匹配后先按声明处理输入</text>
<text x="80" y="1233.0" font-size="18" fill="#53635f" font-weight="400">route 把 method 和 path 对应到函数；框架按输入声明解析、校验，通过后才调用函数正文。</text>
<rect x="64" y="1273.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1306.2" font-size="21" fill="#233734" font-weight="700">业务存在性与版本</text>
<rect x="750" y="1273.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1306.2" font-size="21" fill="#233734" font-weight="700">对外返回结构（response model）</text>
<polyline points="538,1310.2 736,1310.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1310.2 726.9955289764732,1314.5496553411124 726.9955289764732,1305.8503446588877" fill="#286f64"/>
<text x="552.0" y="1298.2" font-size="17" fill="#286f64" font-weight="400">业务处理后交公开结果</text>
<text x="80" y="1356.2" font-size="18" fill="#53635f" font-weight="400">形式合法的输入还须核对当前记录；正常返回的值仍受输出合同检查，不自动撤销先前写入。</text>
<rect x="64" y="1396.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1429.4" font-size="21" fill="#233734" font-weight="700">输入数据形状（model）</text>
<rect x="750" y="1396.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1429.4" font-size="21" fill="#233734" font-weight="700">业务存在性与版本</text>
<polyline points="538,1433.4 736,1433.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1433.4 726.9955289764732,1437.7496553411124 726.9955289764732,1429.0503446588878" fill="#286f64"/>
<text x="603.0" y="1421.4" font-size="17" fill="#286f64" font-weight="400">不能替代</text>
<text x="80" y="1479.4" font-size="18" fill="#53635f" font-weight="400">合法编号与正整数版本，仍可能指向不存在或已变化的当前记录。</text>
<rect x="64" y="1519.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1552.6000000000001" font-size="21" fill="#233734" font-weight="700">对外返回结构（response model）</text>
<rect x="750" y="1519.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1552.6000000000001" font-size="21" fill="#233734" font-weight="700">进程内共享状态（app.state）</text>
<polyline points="538,1556.6000000000001 736,1556.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1556.6000000000001 726.9955289764732,1560.9496553411125 726.9955289764732,1552.2503446588878" fill="#286f64"/>
<text x="569.0" y="1544.6000000000001" font-size="17" fill="#286f64" font-weight="400">失败可能晚于写入</text>
<text x="80" y="1602.6000000000001" font-size="18" fill="#53635f" font-weight="400">响应构造失败不会自动撤销此前已写进内存的工单。</text>
<text x="64" y="1654.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：文档、运行配置与接口测试。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1717.4 1736,1717.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1747.4" font-size="17" fill="#53635f" font-weight="400">对照正文：B02  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1852" width="1800" height="1852" role="img" aria-labelledby="title">
<title id="title">重放承诺与组合证据</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1852" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">X / 一套应用怎样连接起来</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">X03  重放承诺与组合证据</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">用 X01 的成功状态和X02的pending恢复比较不同预期；证据范围再由进程内扩展到真实主机与UAT。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">不重复创建是业务承诺；回应、本地记录、外部效果和日志必须从各自位置相互核对。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="690.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">同一意图未重复创建的可检验承诺</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">业务意图与处理身份</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,553.0 92.0,650.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="575.0" font-size="21" fill="#286f64" font-weight="700">同 key 与相同输入</text>
<text x="103.0" y="605.0" font-size="18" fill="#233734" font-weight="400">稳定键和输入摘要绑定原意图；内容改变返回409并保留原</text>
<text x="103.0" y="630.0" font-size="18" fill="#233734" font-weight="400">行，需另判断修改或新业务。</text>
<polyline points="73.0,567.0 73.0,696.0 91.0,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="674.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="704.0" font-size="21" fill="#233734" font-weight="700">请求追踪号与案例编号（request ID / case_id）</text>
<text x="103.0" y="734.0" font-size="16" fill="#286f64" font-weight="400">处理标识与测试编号</text>
<text x="103.0" y="756.0" font-size="18" fill="#53635f" font-weight="400">请求ID区分一次HTTP处理，测试编号表示一种条件；二者都</text>
<text x="103.0" y="781.0" font-size="18" fill="#53635f" font-weight="400">不是用户身份、访问权或幂等键。</text>
<polyline points="73.0,696.0 73.0,847.0 91.0,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="855.0" font-size="21" fill="#233734" font-weight="700">已收束与 pending 重放</text>
<text x="103.0" y="885.0" font-size="18" fill="#53635f" font-weight="400">已确认重放不再调用合作方，pending恢复则可继续调用；</text>
<text x="103.0" y="910.0" font-size="18" fill="#53635f" font-weight="400">两者均以不新增重复业务效果为目标。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">互补的结果证据</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#233734" font-weight="700">回应与读回结果（response / GET）</text>
<text x="669.3333333333334" y="605.0" font-size="18" fill="#53635f" font-weight="400">核对创建与重放状态、重放标记及全部公开字段，再以独立</text>
<text x="669.3333333333334" y="630.0" font-size="18" fill="#53635f" font-weight="400">读取确认当前可取得同一记录。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,696.0 657.3333333333334,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,682.0 658.3333333333334,779.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="704.0" font-size="21" fill="#286f64" font-weight="700">数据行与持久事件</text>
<text x="669.3333333333334" y="734.0" font-size="18" fill="#233734" font-weight="400">正确库中核对仅一张工单和一条创建事件；SQL须用物理</text>
<text x="669.3333333333334" y="759.0" font-size="18" fill="#233734" font-weight="400">status列，公开列别名不新增字段。</text>
<polyline points="639.3333333333334,696.0 639.3333333333334,825.0 657.3333333333334,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,811.0 658.3333333333334,908.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="833.0" font-size="21" fill="#286f64" font-weight="700">外部调用与效果计数</text>
<text x="669.3333333333334" y="863.0" font-size="18" fill="#233734" font-weight="400">Fake记录补上外部实际行为；本地一张票不能证明只派一</text>
<text x="669.3333333333334" y="888.0" font-size="18" fill="#233734" font-weight="400">次，普通成功与pending恢复预期不同。</text>
<polyline points="639.3333333333334,825.0 639.3333333333334,954.0 657.3333333333334,954.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="932.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="962.0" font-size="21" fill="#233734" font-weight="700">请求日志与允许字段</text>
<text x="669.3333333333334" y="992.0" font-size="18" fill="#53635f" font-weight="400">按本次ID检查实际事件路径，只记允许标识、阶段及结果；</text>
<text x="669.3333333333334" y="1017.0" font-size="18" fill="#53635f" font-weight="400">不记录主题、prompt或原始异常。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">验收合同与运行基线（UAT）</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#233734" font-weight="700">创建、重放、读回、政策</text>
<text x="1235.6666666666667" y="605.0" font-size="18" fill="#53635f" font-weight="400">四个请求分别有ID，共同验证合成客户路线；UAT能查公开</text>
<text x="1235.6666666666667" y="630.0" font-size="18" fill="#53635f" font-weight="400">字段，但不能直接知道外部内部效果。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,696.0 1223.6666666666667,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="704.0" font-size="21" fill="#233734" font-weight="700">全新基线与重放基线（fresh / replay）</text>
<text x="1235.6666666666667" y="734.0" font-size="18" fill="#53635f" font-weight="400">首次请求须按指定模式新建或复用，基线错误应失败；改变</text>
<text x="1235.6666666666667" y="759.0" font-size="18" fill="#53635f" font-weight="400">AI场景不等于重新创建既有意图。</text>
<polyline points="1205.6666666666667,696.0 1205.6666666666667,825.0 1223.6666666666667,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="833.0" font-size="21" fill="#233734" font-weight="700">证据矛盾的复核</text>
<text x="1235.6666666666667" y="863.0" font-size="18" fill="#53635f" font-weight="400">日志称已提交但行不存在时，应查事件时机与数据库目标；</text>
<text x="1235.6666666666667" y="888.0" font-size="18" fill="#53635f" font-weight="400">不能让日志文字覆盖持久事实。</text>
<text x="64" y="1081.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1081.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1106.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1139.0" font-size="21" fill="#233734" font-weight="700">同 key 与相同输入</text>
<rect x="750" y="1106.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1139.0" font-size="21" fill="#233734" font-weight="700">已收束与 pending 重放</text>
<polyline points="538,1143.0 736,1143.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1143.0 726.9955289764732,1147.3496553411123 726.9955289764732,1138.6503446588877" fill="#286f64"/>
<text x="586.0" y="1131.0" font-size="17" fill="#286f64" font-weight="400">决定重放资格</text>
<text x="80" y="1189.0" font-size="18" fill="#53635f" font-weight="400">键相同但摘要不同属于冲突；摘要一致后，还须看原派单是否已经收束。</text>
<rect x="64" y="1229.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1262.2" font-size="21" fill="#233734" font-weight="700">回应与读回结果（response / GET）</text>
<rect x="750" y="1229.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1262.2" font-size="21" fill="#233734" font-weight="700">数据行与持久事件</text>
<polyline points="538,1266.2 736,1266.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1266.2 726.9955289764732,1270.5496553411124 726.9955289764732,1261.8503446588877" fill="#286f64"/>
<text x="569.0" y="1254.2" font-size="17" fill="#286f64" font-weight="400">需要持久事实补足</text>
<text x="80" y="1312.2" font-size="18" fill="#53635f" font-weight="400">返回旧编号仍可能隐藏重复行，公开结果相同不能独证仅创建一次。</text>
<rect x="64" y="1352.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1385.4" font-size="21" fill="#233734" font-weight="700">数据行与持久事件</text>
<rect x="750" y="1352.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1385.4" font-size="21" fill="#233734" font-weight="700">外部调用与效果计数</text>
<polyline points="538,1389.4 736,1389.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1389.4 726.9955289764732,1393.7496553411124 726.9955289764732,1385.0503446588878" fill="#286f64"/>
<text x="569.0" y="1377.4" font-size="17" fill="#286f64" font-weight="400">不能替代外部证据</text>
<text x="80" y="1435.4" font-size="18" fill="#53635f" font-weight="400">只有本地工单计数无法确定派单次数；两边事实必须各自观察。</text>
<rect x="64" y="1475.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1508.6000000000001" font-size="21" fill="#233734" font-weight="700">全新基线与重放基线（fresh / replay）</text>
<rect x="750" y="1475.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1508.6000000000001" font-size="21" fill="#233734" font-weight="700">创建、重放、读回、政策</text>
<polyline points="538,1512.6000000000001 736,1512.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1512.6000000000001 726.9955289764732,1516.9496553411125 726.9955289764732,1508.2503446588878" fill="#286f64"/>
<text x="586.0" y="1500.6000000000001" font-size="17" fill="#286f64" font-weight="400">约束路线预期</text>
<text x="80" y="1558.6000000000001" font-size="18" fill="#53635f" font-weight="400">已存在工单上切AI场景应明确复用；四项请求仍是独立处理，不共享单个请求ID。</text>
<rect x="64" y="1598.8000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1631.8000000000002" font-size="21" fill="#233734" font-weight="700">请求日志与允许字段</text>
<rect x="750" y="1598.8000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1631.8000000000002" font-size="21" fill="#233734" font-weight="700">数据行与持久事件</text>
<polyline points="538,1635.8000000000002 736,1635.8000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1635.8000000000002 726.9955289764732,1640.1496553411125 726.9955289764732,1631.4503446588878" fill="#286f64"/>
<text x="577.5" y="1623.8000000000002" font-size="17" fill="#286f64" font-weight="400">定位但不能替代</text>
<text x="80" y="1681.8000000000002" font-size="18" fill="#53635f" font-weight="400">核对实际数据库目标和日志产生时机；写着成功不等于对应事务必然提交。</text>
<text x="64" y="1734.0000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：测试范围与失效定位。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1796.6000000000001 1736,1796.6000000000001" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1826.6000000000001" font-size="17" fill="#53635f" font-weight="400">对照正文：X03  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
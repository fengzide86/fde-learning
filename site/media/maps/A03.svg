<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2001" width="1800" height="2001" role="img" aria-labelledby="title">
<title id="title">程序为什么走这一条路？</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="2001" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">A / 程序与工具</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">A03  程序为什么走这一条路？</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">A03把A02得到的值转成执行选择；A04让选择进入多轮处理，A05区分普通拒绝与操作失败。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">先由值形成条件，再按实际检查顺序选择路线；选中分支与结束整个函数不是同一种控制。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="732.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">条件事实与执行路线的选择</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,400.0 1537.125,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,400.0 262.875,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">形成判断依据</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="358.75" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,516.0 92.0,635.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="538.0" font-size="21" fill="#286f64" font-weight="700">比较产生真假结果（bool）</text>
<text x="103.0" y="568.0" font-size="16" fill="#286f64" font-weight="400">比较运算与结果类型</text>
<text x="103.0" y="590.0" font-size="18" fill="#233734" font-weight="400">大小和相等比较产生True或False；==检查</text>
<text x="103.0" y="615.0" font-size="18" fill="#233734" font-weight="400">相等，=负责赋值，两种动作不能替代。</text>
<polyline points="73.0,530.0 73.0,681.0 91.0,681.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="659.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="689.0" font-size="21" fill="#233734" font-weight="700">取余 %</text>
<text x="103.0" y="719.0" font-size="18" fill="#53635f" font-weight="400">计算除法余数，为奇偶或周期判断提供</text>
<text x="103.0" y="744.0" font-size="18" fill="#53635f" font-weight="400">值；它本身不决定走哪个入口或执行分</text>
<text x="103.0" y="769.0" font-size="18" fill="#53635f" font-weight="400">支。</text>
<polyline points="73.0,681.0 73.0,835.0 91.0,835.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="813.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="843.0" font-size="21" fill="#233734" font-weight="700">链式比较</text>
<text x="103.0" y="873.0" font-size="18" fill="#53635f" font-weight="400">把同一值的上下界连成范围条件，如12≤</text>
<text x="103.0" y="898.0" font-size="18" fill="#53635f" font-weight="400">age≤70；前段不成立时不再继续比较。</text>
<polyline points="687.625,400.0 687.625,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="488.75" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="502.75" y="465.0" font-size="23" fill="#286f64" font-weight="700">组合条件</text>
<polyline points="497.75,488.0 497.75,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="497.75,488.0 497.75,530.0 515.75,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="508.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="538.0" font-size="21" fill="#233734" font-weight="700">至少一个条件成立（or）</text>
<text x="527.75" y="568.0" font-size="18" fill="#53635f" font-weight="400">从左求值，左边已为真时跳过右边；本章</text>
<text x="527.75" y="593.0" font-size="18" fill="#53635f" font-weight="400">组合布尔比较，不能外推为总返回bool。</text>
<polyline points="497.75,530.0 497.75,659.0 515.75,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="637.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="667.0" font-size="21" fill="#233734" font-weight="700">多个条件同时成立（and）</text>
<text x="527.75" y="697.0" font-size="18" fill="#53635f" font-weight="400">从左求值，左边已为假时跳过右边；本章</text>
<text x="527.75" y="722.0" font-size="18" fill="#53635f" font-weight="400">用于同时满足要求，其他值另有取值规</text>
<text x="527.75" y="747.0" font-size="18" fill="#53635f" font-weight="400">则。</text>
<polyline points="497.75,659.0 497.75,813.0 515.75,813.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="791.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="821.0" font-size="21" fill="#233734" font-weight="700">反转真假判断（not）</text>
<text x="527.75" y="851.0" font-size="18" fill="#53635f" font-weight="400">反转真假得到布尔值，可把检查通过改写</text>
<text x="527.75" y="876.0" font-size="18" fill="#53635f" font-weight="400">成不通过时执行的条件。</text>
<polyline points="497.75,813.0 497.75,942.0 515.75,942.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="920.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="950.0" font-size="21" fill="#233734" font-weight="700">短路</text>
<text x="527.75" y="980.0" font-size="18" fill="#53635f" font-weight="400">左侧已能决定结果时不再计算右侧；能算</text>
<text x="527.75" y="1005.0" font-size="18" fill="#53635f" font-weight="400">出某条件，不代表该条件实际执行过。</text>
<polyline points="1112.375,400.0 1112.375,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="913.5" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="927.5" y="465.0" font-size="23" fill="#286f64" font-weight="700">分支结构</text>
<polyline points="922.5,488.0 922.5,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="922.5,488.0 922.5,530.0 940.5,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="508.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="538.0" font-size="21" fill="#233734" font-weight="700">条件分支（if）</text>
<text x="952.5" y="568.0" font-size="18" fill="#53635f" font-weight="400">按条件决定是否执行所属代码块；条件为</text>
<text x="952.5" y="593.0" font-size="18" fill="#53635f" font-weight="400">假只跳过该块，不自动停止整个程序。</text>
<polyline points="922.5,530.0 922.5,659.0 940.5,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="637.0" width="358.75" height="160" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="941.5,645.0 941.5,789.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="952.5" y="667.0" font-size="21" fill="#286f64" font-weight="700">互斥路线（if / elif / else）</text>
<text x="952.5" y="697.0" font-size="16" fill="#286f64" font-weight="400">条件分支结构</text>
<text x="952.5" y="719.0" font-size="18" fill="#233734" font-weight="400">从上向下选择第一条匹配路线，之后跳过</text>
<text x="952.5" y="744.0" font-size="18" fill="#233734" font-weight="400">余下分支；else只接住此前都未选中的情</text>
<text x="952.5" y="769.0" font-size="18" fill="#233734" font-weight="400">况。</text>
<polyline points="922.5,659.0 922.5,835.0 940.5,835.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="813.0" width="358.75" height="160" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="843.0" font-size="21" fill="#233734" font-weight="700">分别检查条件（独立 if）</text>
<text x="952.5" y="873.0" font-size="16" fill="#286f64" font-weight="400">各自检查的分支</text>
<text x="952.5" y="895.0" font-size="18" fill="#53635f" font-weight="400">前段结束后继续检查下一个条件，可能再</text>
<text x="952.5" y="920.0" font-size="18" fill="#53635f" font-weight="400">次赋值；适合分别检查多个可同时成立的</text>
<text x="952.5" y="945.0" font-size="18" fill="#53635f" font-weight="400">要求。</text>
<polyline points="922.5,835.0 922.5,1011.0 940.5,1011.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="989.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="1019.0" font-size="21" fill="#233734" font-weight="700">按模式选择（match / case）</text>
<text x="952.5" y="1049.0" font-size="18" fill="#53635f" font-weight="400">本章按确定文字选项匹配，case _接剩余</text>
<text x="952.5" y="1074.0" font-size="18" fill="#53635f" font-weight="400">情况；选中后不落入下一case，需</text>
<text x="952.5" y="1099.0" font-size="18" fill="#53635f" font-weight="400">Python3.10起。</text>
<polyline points="1537.125,400.0 1537.125,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1338.25" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1352.25" y="465.0" font-size="23" fill="#286f64" font-weight="700">规则组织与验证</text>
<polyline points="1347.25,488.0 1347.25,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1347.25,488.0 1347.25,530.0 1365.25,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="508.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="538.0" font-size="21" fill="#233734" font-weight="700">提前交回结果（return）</text>
<text x="1377.25" y="568.0" font-size="18" fill="#53635f" font-weight="400">发现拒绝条件后结束当前函数并交回结</text>
<text x="1377.25" y="593.0" font-size="18" fill="#53635f" font-weight="400">果，使后续代码在已经排除失败的前提下</text>
<text x="1377.25" y="618.0" font-size="18" fill="#53635f" font-weight="400">运行。</text>
<polyline points="1347.25,530.0 1347.25,684.0 1365.25,684.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="662.0" width="358.75" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1366.25,670.0 1366.25,789.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1377.25" y="692.0" font-size="21" fill="#286f64" font-weight="700">规则优先级</text>
<text x="1377.25" y="722.0" font-size="16" fill="#286f64" font-weight="400">业务约定</text>
<text x="1377.25" y="744.0" font-size="18" fill="#233734" font-weight="400">检查顺序决定先拒绝、先候补还是先分</text>
<text x="1377.25" y="769.0" font-size="18" fill="#233734" font-weight="400">类；后面的条件可能成立但根本没执行。</text>
<polyline points="1347.25,684.0 1347.25,835.0 1365.25,835.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="813.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="843.0" font-size="21" fill="#233734" font-weight="700">边界输入</text>
<text x="1377.25" y="873.0" font-size="18" fill="#53635f" font-weight="400">选择上下限、类别切换和条件同时成立的</text>
<text x="1377.25" y="898.0" font-size="18" fill="#53635f" font-weight="400">输入，检验边界是否包含与规则先后是否</text>
<text x="1377.25" y="923.0" font-size="18" fill="#53635f" font-weight="400">正确。</text>
<polyline points="1347.25,835.0 1347.25,989.0 1365.25,989.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="967.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="997.0" font-size="21" fill="#233734" font-weight="700">判断结果与业务动作</text>
<text x="1377.25" y="1027.0" font-size="18" fill="#53635f" font-weight="400">返回接受或候补说明只完成本次判断；不</text>
<text x="1377.25" y="1052.0" font-size="18" fill="#53635f" font-weight="400">代表已经扣减名额、保存记录或执行后续</text>
<text x="1377.25" y="1077.0" font-size="18" fill="#53635f" font-weight="400">动作。</text>
<text x="64" y="1163.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1163.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1188.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1221.0" font-size="21" fill="#233734" font-weight="700">取余 %</text>
<rect x="750" y="1188.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1221.0" font-size="21" fill="#233734" font-weight="700">比较产生真假结果（bool）</text>
<polyline points="538,1225.0 736,1225.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1225.0 726.9955289764732,1229.3496553411123 726.9955289764732,1220.6503446588877" fill="#286f64"/>
<text x="586.0" y="1213.0" font-size="17" fill="#286f64" font-weight="400">提供待比较值</text>
<text x="80" y="1271.0" font-size="18" fill="#53635f" font-weight="400">先取得余数，再比较是否为零，分支才有可用条件。</text>
<rect x="64" y="1311.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1344.2" font-size="21" fill="#233734" font-weight="700">短路</text>
<rect x="750" y="1311.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1344.2" font-size="21" fill="#233734" font-weight="700">多个条件同时成立（and）</text>
<polyline points="538,1348.2 736,1348.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1348.2 726.9955289764732,1352.5496553411124 726.9955289764732,1343.8503446588877" fill="#286f64"/>
<text x="569.0" y="1336.2" font-size="17" fill="#286f64" font-weight="400">决定右侧是否求值</text>
<text x="80" y="1394.2" font-size="18" fill="#53635f" font-weight="400">and在左侧为假时停止；or在左侧为真时停止，二者停止条件不同。</text>
<rect x="64" y="1434.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1467.4" font-size="21" fill="#233734" font-weight="700">规则优先级</text>
<rect x="750" y="1434.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1467.4" font-size="21" fill="#233734" font-weight="700">互斥路线（if / elif / else）</text>
<polyline points="538,1471.4 736,1471.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1471.4 726.9955289764732,1475.7496553411124 726.9955289764732,1467.0503446588878" fill="#286f64"/>
<text x="577.5" y="1459.4" font-size="17" fill="#286f64" font-weight="400">落实为检查次序</text>
<text x="80" y="1517.4" font-size="18" fill="#53635f" font-weight="400">剩余路线能假定什么，取决于前面已排除了什么。</text>
<rect x="64" y="1557.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1590.6000000000001" font-size="21" fill="#233734" font-weight="700">提前交回结果（return）</text>
<rect x="750" y="1557.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1590.6000000000001" font-size="21" fill="#233734" font-weight="700">分别检查条件（独立 if）</text>
<polyline points="538,1594.6000000000001 736,1594.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1594.6000000000001 726.9955289764732,1598.9496553411125 726.9955289764732,1590.2503446588878" fill="#286f64"/>
<text x="586.0" y="1582.6000000000001" font-size="17" fill="#286f64" font-weight="400">阻止后续检查</text>
<text x="80" y="1640.6000000000001" font-size="18" fill="#53635f" font-weight="400">连续独立if也可逐项拒绝，但起作用的是函数已返回，不是赋值自动终止。</text>
<rect x="64" y="1680.8000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1713.8000000000002" font-size="21" fill="#233734" font-weight="700">比较产生真假结果（bool）</text>
<rect x="750" y="1680.8000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1713.8000000000002" font-size="21" fill="#233734" font-weight="700">条件分支（if）</text>
<polyline points="538,1717.8000000000002 736,1717.8000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1717.8000000000002 726.9955289764732,1722.1496553411125 726.9955289764732,1713.4503446588878" fill="#286f64"/>
<text x="577.5" y="1705.8000000000002" font-size="17" fill="#286f64" font-weight="400">提供条件供选路</text>
<text x="80" y="1763.8000000000002" font-size="18" fill="#53635f" font-weight="400">age &gt;= 12先求得真假，if再决定是否执行所属块；比较本身不执行业务动作。</text>
<rect x="64" y="1804.0000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1837.0000000000002" font-size="21" fill="#233734" font-weight="700">互斥路线（if / elif / else）</text>

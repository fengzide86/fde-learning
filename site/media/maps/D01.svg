<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1847" width="1800" height="1847" role="img" aria-labelledby="title">
<title id="title">依赖失败的责任位置</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1847" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">D / 外部依赖可靠性</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">D01  依赖失败的责任位置</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">复用 B 册两段HTTP交换和客户端检查，结合 C 册事实意识；失败类别是D02选择再次尝试的依据。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">先区分本地输入、传输、状态和内容在哪处失败；已有多少证据，就只作出证据支持的判断。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="690.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">外部结果的失败类别与可观察边界</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 1466.3333333333335,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 333.6666666666667,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">调用关系与结果约定</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,516.0 92.0,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="538.0" font-size="21" fill="#286f64" font-weight="700">本地与合作方回应</text>
<text x="103.0" y="568.0" font-size="18" fill="#233734" font-weight="400">本地先接收用户请求再请求合作方，两份回应分别成立；本</text>
<text x="103.0" y="593.0" font-size="18" fill="#233734" font-weight="400">地有回应不代表已取得外部回应。</text>
<polyline points="73.0,530.0 73.0,659.0 91.0,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="637.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="667.0" font-size="21" fill="#233734" font-weight="700">外部调用适配层（adapter）</text>
<text x="103.0" y="697.0" font-size="16" fill="#286f64" font-weight="400">适配边界</text>
<text x="103.0" y="719.0" font-size="18" fill="#53635f" font-weight="400">构造外部请求，检查状态及内容，翻译为业务结果或明确失</text>
<text x="103.0" y="744.0" font-size="18" fill="#53635f" font-weight="400">败；避免各入口重复处理外部协议。</text>
<polyline points="73.0,659.0 73.0,810.0 91.0,810.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="788.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,796.0 92.0,893.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="818.0" font-size="21" fill="#286f64" font-weight="700">服务范围结果</text>
<text x="103.0" y="848.0" font-size="18" fill="#233734" font-weight="400">要求布尔服务范围与非空区域字段；坏字段不能默认为不支</text>
<text x="103.0" y="873.0" font-size="18" fill="#233734" font-weight="400">持，本次读取也不创建或占名额。</text>
<polyline points="900.0,400.0 900.0,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="465.0" font-size="23" fill="#286f64" font-weight="700">最早失败位置</text>
<polyline points="639.3333333333334,488.0 639.3333333333334,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,488.0 639.3333333333334,530.0 657.3333333333334,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="508.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="538.0" font-size="21" fill="#233734" font-weight="700">本地输入失败</text>
<text x="669.3333333333334" y="568.0" font-size="16" fill="#286f64" font-weight="400">失败位置</text>
<text x="669.3333333333334" y="590.0" font-size="18" fill="#53635f" font-weight="400">缺邮编在进入业务函数前返回422；应核对外部调用为零，</text>
<text x="669.3333333333334" y="615.0" font-size="18" fill="#53635f" font-weight="400">而非只看没有新增业务效果。</text>
<polyline points="639.3333333333334,530.0 639.3333333333334,681.0 657.3333333333334,681.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="659.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="689.0" font-size="21" fill="#233734" font-weight="700">传输失败</text>
<text x="669.3333333333334" y="719.0" font-size="16" fill="#286f64" font-weight="400">失败位置</text>
<text x="669.3333333333334" y="741.0" font-size="18" fill="#53635f" font-weight="400">完整调用未交回可用回应；超时是一般请求错误的具体类</text>
<text x="669.3333333333334" y="766.0" font-size="18" fill="#53635f" font-weight="400">别，不能据此断言远端没执行。</text>
<polyline points="639.3333333333334,681.0 639.3333333333334,832.0 657.3333333333334,832.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="810.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="840.0" font-size="21" fill="#233734" font-weight="700">回应状态失败（HTTP状态）</text>
<text x="669.3333333333334" y="870.0" font-size="16" fill="#286f64" font-weight="400">失败位置</text>
<text x="669.3333333333334" y="892.0" font-size="18" fill="#53635f" font-weight="400">已有合作方回应但状态非成功；本地可映射成另一状态，应</text>
<text x="669.3333333333334" y="917.0" font-size="18" fill="#53635f" font-weight="400">保留两段交换的责任。</text>
<polyline points="639.3333333333334,832.0 639.3333333333334,983.0 657.3333333333334,983.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="961.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="991.0" font-size="21" fill="#233734" font-weight="700">内容解析与合同失败</text>
<text x="669.3333333333334" y="1021.0" font-size="16" fill="#286f64" font-weight="400">失败位置</text>
<text x="669.3333333333334" y="1043.0" font-size="18" fill="#53635f" font-weight="400">成功状态后，坏JSON不能解析，坏字段则已成对象却不合用</text>
<text x="669.3333333333334" y="1068.0" font-size="18" fill="#53635f" font-weight="400">途；两者都不能作为正常结果。</text>
<polyline points="1466.3333333333335,400.0 1466.3333333333335,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="465.0" font-size="23" fill="#286f64" font-weight="700">替换边界与证据范围</text>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,530.0 1223.6666666666667,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="508.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="538.0" font-size="21" fill="#233734" font-weight="700">接口测试与传输替身（TestClient / MockTransport）</text>
<text x="1235.6666666666667" y="568.0" font-size="16" fill="#286f64" font-weight="400">不同位置的测试工具</text>
<text x="1235.6666666666667" y="590.0" font-size="18" fill="#53635f" font-weight="400">前者进入本地接口，后者替换HTTP传输；保留真实请求构造</text>
<text x="1235.6666666666667" y="615.0" font-size="18" fill="#53635f" font-weight="400">与适配检查，便于固定失败。</text>
<polyline points="1205.6666666666667,530.0 1205.6666666666667,681.0 1223.6666666666667,681.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="659.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="689.0" font-size="21" fill="#233734" font-weight="700">有状态 fake</text>
<text x="1235.6666666666667" y="719.0" font-size="18" fill="#53635f" font-weight="400">保存业务结果并支持查询与重复调用；可配合传输替身，但</text>
<text x="1235.6666666666667" y="744.0" font-size="18" fill="#53635f" font-weight="400">不能证明真实凭据或网络有效。</text>
<polyline points="1205.6666666666667,681.0 1205.6666666666667,810.0 1223.6666666666667,810.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="788.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,796.0 1224.6666666666667,893.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="818.0" font-size="21" fill="#286f64" font-weight="700">调用记录与结果断言</text>
<text x="1235.6666666666667" y="848.0" font-size="18" fill="#233734" font-weight="400">分别核对调用数、已有回应和本地结果；五种失败场景归为</text>
<text x="1235.6666666666667" y="873.0" font-size="18" fill="#233734" font-weight="400">四类位置，不是五层架构。</text>
<text x="64" y="1132.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1132.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1157.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1190.0" font-size="21" fill="#233734" font-weight="700">本地与合作方回应</text>
<rect x="750" y="1157.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1190.0" font-size="21" fill="#233734" font-weight="700">外部调用适配层（adapter）</text>
<polyline points="538,1194.0 736,1194.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1194.0 726.9955289764732,1198.3496553411123 726.9955289764732,1189.6503446588877" fill="#286f64"/>
<text x="552.0" y="1182.0" font-size="17" fill="#286f64" font-weight="400">外部回应先经适配检查</text>
<text x="80" y="1240.0" font-size="18" fill="#53635f" font-weight="400">本地200或504是外层交代，不能据此推断内层是否已有回应或用了相同状态码。</text>
<rect x="64" y="1280.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1313.2" font-size="21" fill="#233734" font-weight="700">外部调用适配层（adapter）</text>
<rect x="750" y="1280.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1313.2" font-size="21" fill="#233734" font-weight="700">服务范围结果</text>
<polyline points="538,1317.2 736,1317.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1317.2 726.9955289764732,1321.5496553411124 726.9955289764732,1312.8503446588877" fill="#286f64"/>
<text x="577.5" y="1305.2" font-size="17" fill="#286f64" font-weight="400">检查通过才交回</text>
<text x="80" y="1363.2" font-size="18" fill="#53635f" font-weight="400">字段无法证明是否支持时保留失败；不能用默认 False 把未知改成确认不支持。</text>
<rect x="64" y="1403.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1436.4" font-size="21" fill="#233734" font-weight="700">本地输入失败</text>
<rect x="750" y="1403.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1436.4" font-size="21" fill="#233734" font-weight="700">调用记录与结果断言</text>
<polyline points="538,1440.4 736,1440.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1440.4 726.9955289764732,1444.7496553411124 726.9955289764732,1436.0503446588878" fill="#286f64"/>
<text x="586.0" y="1428.4" font-size="17" fill="#286f64" font-weight="400">用零调用验证</text>
<text x="80" y="1486.4" font-size="18" fill="#53635f" font-weight="400">输入已拒绝却仍调用一次，即使没有外部效果，也违背本地保护边界。</text>
<rect x="64" y="1526.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1559.6000000000001" font-size="21" fill="#233734" font-weight="700">回应状态失败（HTTP状态）</text>
<rect x="750" y="1526.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1559.6000000000001" font-size="21" fill="#233734" font-weight="700">内容解析与合同失败</text>
<polyline points="538,1563.6000000000001 736,1563.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1563.6000000000001 726.9955289764732,1567.9496553411125 726.9955289764732,1559.2503446588878" fill="#286f64"/>
<text x="611.5" y="1551.6000000000001" font-size="17" fill="#286f64" font-weight="400">不同于</text>
<text x="80" y="1609.6000000000001" font-size="18" fill="#53635f" font-weight="400">后者已有成功类状态却缺可用内容，不能统一误报为网络不通。</text>
<rect x="64" y="1649.8000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1682.8000000000002" font-size="21" fill="#233734" font-weight="700">接口测试与传输替身（TestClient / MockTransport）</text>
<rect x="750" y="1649.8000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1682.8000000000002" font-size="21" fill="#233734" font-weight="700">外部调用适配层（adapter）</text>
<polyline points="538,1686.8000000000002 736,1686.8000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1686.8000000000002 726.9955289764732,1691.1496553411125 726.9955289764732,1682.4503446588878" fill="#286f64"/>
<text x="594.5" y="1674.8000000000002" font-size="17" fill="#286f64" font-weight="400">保留并验证</text>
<text x="80" y="1732.8000000000002" font-size="18" fill="#53635f" font-weight="400">直接替换整个适配函数只能验证包装，替换传输才能覆盖请求和内容检查。</text>
<polyline points="64,1791.0000000000002 1736,1791.0000000000002" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1821.0000000000002" font-size="17" fill="#53635f" font-weight="400">对照正文：D01  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
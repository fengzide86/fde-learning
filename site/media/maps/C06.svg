<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1644" width="1800" height="1644" role="img" aria-labelledby="title">
<title id="title">查询计划与性能判断</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1644" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">C / 数据与日志</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">C06  查询计划与性能判断</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">接续 C05 的固定读取与计时范围；优化仍服从原查询合同，完整业务模型需用真实关联重新验证。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">先保证仍是同一份正确答案，再用计划解释访问路线、用相同条件的实测判断收益，最后权衡维护成本。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="690.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">正确答案前提下的查询收益与成本</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">业务基线与复现范围</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,553.0 92.0,650.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="575.0" font-size="21" fill="#286f64" font-weight="700">正确结果与稳定顺序</text>
<text x="103.0" y="605.0" font-size="18" fill="#233734" font-weight="400">固定客户、完整列、20个预期ID及并列顺序；仅行数正确不</text>
<text x="103.0" y="630.0" font-size="18" fill="#233734" font-weight="400">足以证明仍回答同一业务问题。</text>
<polyline points="73.0,567.0 73.0,696.0 91.0,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="704.0" font-size="21" fill="#233734" font-weight="700">代表数据与计时范围</text>
<text x="103.0" y="734.0" font-size="18" fill="#53635f" font-weight="400">用同类慢事件找复现输入，明确是否包含取连接和取完结</text>
<text x="103.0" y="759.0" font-size="18" fill="#53635f" font-weight="400">果；一次慢值不能全部归因SQL。</text>
<polyline points="73.0,696.0 73.0,825.0 91.0,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="833.0" font-size="21" fill="#233734" font-weight="700">先纠正关联条件</text>
<text x="103.0" y="863.0" font-size="18" fill="#53635f" font-weight="400">错JOIN产生错误组合时先修ON；更快返回或加DISTINCT不</text>
<text x="103.0" y="888.0" font-size="18" fill="#53635f" font-weight="400">能把错误归属变成正确事实。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">访问路线与索引</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,553.0 658.3333333333334,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#286f64" font-weight="700">查询执行计划（EXPLAIN QUERY PLAN）</text>
<text x="669.3333333333334" y="605.0" font-size="16" fill="#286f64" font-weight="400">计划观察入口</text>
<text x="669.3333333333334" y="627.0" font-size="18" fill="#233734" font-weight="400">显示数据库选择的访问路线；读表名、索引名、条件和排序</text>
<text x="669.3333333333334" y="652.0" font-size="18" fill="#233734" font-weight="400">工作，计划不是业务正确性证明。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,718.0 657.3333333333334,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="726.0" font-size="21" fill="#233734" font-weight="700">访问方式（SCAN / SEARCH）</text>
<text x="669.3333333333334" y="756.0" font-size="18" fill="#53635f" font-weight="400">SCAN遍历全部记录且可能沿索引，SEARCH按条件定位部</text>
<text x="669.3333333333334" y="781.0" font-size="18" fill="#53635f" font-weight="400">分；单凭关键词不能断言好坏。</text>
<polyline points="639.3333333333334,718.0 639.3333333333334,847.0 657.3333333333334,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="825.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="855.0" font-size="21" fill="#233734" font-weight="700">客户索引与临时排序</text>
<text x="669.3333333333334" y="885.0" font-size="16" fill="#286f64" font-weight="400">访问与排序工作</text>
<text x="669.3333333333334" y="907.0" font-size="18" fill="#53635f" font-weight="400">单列客户索引可减少无关行访问，却不承诺完成时间与ID排</text>
<text x="669.3333333333334" y="932.0" font-size="18" fill="#53635f" font-weight="400">序；临时排序仍在不等于失败。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">实测收益与维护成本</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#233734" font-weight="700">预热、重复样本与中位数</text>
<text x="1235.6666666666667" y="605.0" font-size="16" fill="#286f64" font-weight="400">实测比较方法</text>
<text x="1235.6666666666667" y="627.0" font-size="18" fill="#53635f" font-weight="400">同数据、SQL、输入和计时范围比较前后样本；中位数减弱</text>
<text x="1235.6666666666667" y="652.0" font-size="18" fill="#53635f" font-weight="400">极端值影响，不代表最慢请求。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,718.0 1223.6666666666667,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="696.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="726.0" font-size="21" fill="#233734" font-weight="700">选择性与输入分布</text>
<text x="1235.6666666666667" y="756.0" font-size="18" fill="#53635f" font-weight="400">看具体条件能缩小多少行；少数取值也可能有稀少目标，同</text>
<text x="1235.6666666666667" y="781.0" font-size="18" fill="#53635f" font-weight="400">一索引对不同客户收益不同。</text>
<polyline points="1205.6666666666667,718.0 1205.6666666666667,847.0 1223.6666666666667,847.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="825.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1224.6666666666667,833.0 1224.6666666666667,930.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1235.6666666666667" y="855.0" font-size="21" fill="#286f64" font-weight="700">索引维护成本</text>
<text x="1235.6666666666667" y="885.0" font-size="18" fill="#233734" font-weight="400">索引占空间并增加相关写入维护；是否保留还取决于读取频</text>
<text x="1235.6666666666667" y="910.0" font-size="18" fill="#233734" font-weight="400">率、收益和写入负担。</text>
<text x="64" y="996.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="996.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1021.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1054.0" font-size="21" fill="#233734" font-weight="700">正确结果与稳定顺序</text>
<rect x="750" y="1021.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1054.0" font-size="21" fill="#233734" font-weight="700">预热、重复样本与中位数</text>
<polyline points="538,1058.0 736,1058.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1058.0 726.9955289764732,1062.3496553411123 726.9955289764732,1053.6503446588877" fill="#286f64"/>
<text x="586.0" y="1046.0" font-size="17" fill="#286f64" font-weight="400">约束优化比较</text>
<text x="80" y="1104.0" font-size="18" fill="#53635f" font-weight="400">前后必须逐行相同；修复错误查询后旧耗时不再是同一工作的基线。</text>
<rect x="64" y="1144.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1177.2" font-size="21" fill="#233734" font-weight="700">查询执行计划（EXPLAIN QUERY PLAN）</text>
<rect x="750" y="1144.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1177.2" font-size="21" fill="#233734" font-weight="700">预热、重复样本与中位数</text>
<polyline points="538,1181.2 736,1181.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1181.2 726.9955289764732,1185.5496553411124 726.9955289764732,1176.8503446588877" fill="#286f64"/>
<text x="577.5" y="1169.2" font-size="17" fill="#286f64" font-weight="400">需实测检验收益</text>
<text x="80" y="1227.2" font-size="18" fill="#53635f" font-weight="400">计划说明减少了哪些访问，实际省时多少仍取决于相同条件下的运行。</text>
<rect x="64" y="1267.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1300.4" font-size="21" fill="#233734" font-weight="700">选择性与输入分布</text>
<rect x="750" y="1267.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1300.4" font-size="21" fill="#233734" font-weight="700">客户索引与临时排序</text>
<polyline points="538,1304.4 736,1304.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1304.4 726.9955289764732,1308.7496553411124 726.9955289764732,1300.0503446588878" fill="#286f64"/>
<text x="603.0" y="1292.4" font-size="17" fill="#286f64" font-weight="400">影响收益</text>
<text x="80" y="1350.4" font-size="18" fill="#53635f" font-weight="400">索引筛到少量预约有机会节省访问；匹配全表多数时收益可能很小。</text>
<rect x="64" y="1390.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1423.6000000000001" font-size="21" fill="#233734" font-weight="700">预热、重复样本与中位数</text>
<rect x="750" y="1390.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1423.6000000000001" font-size="21" fill="#233734" font-weight="700">索引维护成本</text>
<polyline points="538,1427.6000000000001 736,1427.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1427.6000000000001 726.9955289764732,1431.9496553411125 726.9955289764732,1423.2503446588878" fill="#286f64"/>
<text x="577.5" y="1415.6000000000001" font-size="17" fill="#286f64" font-weight="400">需权衡额外代价</text>
<text x="80" y="1473.6000000000001" font-size="18" fill="#53635f" font-weight="400">读得快一些不能独自决定保留索引，当前内存程序也未测出空间与写入成本。</text>
<text x="64" y="1525.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：证据边界与扩展。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1588.4 1736,1588.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1618.4" font-size="17" fill="#53635f" font-weight="400">对照正文：C06  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1506" width="1800" height="1506" role="img" aria-labelledby="title">
<title id="title">方案匹配与有界选择</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1506" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">P / 产品与业务</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">P06  方案匹配与有界选择</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">用 P03–05 的问题和工作证据比较办法，再交给 P07 判断现金、时间与维护是否承担得起。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">选择改变真实限制的办法；缺少事实、权限或维护条件时，应缩小范围而非硬上技术。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="732.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">按限制与风险选择改变范围</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 1466.3333333333335,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 333.6666666666667,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">办法与问题的匹配</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,516.0 92.0,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="538.0" font-size="21" fill="#286f64" font-weight="700">有界改善目标</text>
<text x="103.0" y="568.0" font-size="18" fill="#233734" font-weight="400">明确当前要接住什么工作与信息，不预定机器自动作承诺；</text>
<text x="103.0" y="593.0" font-size="18" fill="#233734" font-weight="400">目标范围仍受现有证据限制。</text>
<polyline points="73.0,530.0 73.0,659.0 91.0,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,645.0 92.0,742.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="667.0" font-size="21" fill="#286f64" font-weight="700">流程、采购、自建与 AI</text>
<text x="103.0" y="697.0" font-size="18" fill="#233734" font-weight="400">分别改变责任、现成能力、信息连接或文字处理；不要求每</text>
<text x="103.0" y="722.0" font-size="18" fill="#233734" font-weight="400">次全选，须看哪项改变真实限制。</text>
<polyline points="73.0,659.0 73.0,788.0 91.0,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="796.0" font-size="21" fill="#233734" font-weight="700">代表任务核对</text>
<text x="103.0" y="826.0" font-size="18" fill="#53635f" font-weight="400">让候选走过当前角色、旧数据、等待和权限；供应商理想演</text>
<text x="103.0" y="851.0" font-size="18" fill="#53635f" font-weight="400">示只证明其演示情境。</text>
<polyline points="900.0,400.0 900.0,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="465.0" font-size="23" fill="#286f64" font-weight="700">可行条件与后果</text>
<polyline points="639.3333333333334,488.0 639.3333333333334,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,488.0 639.3333333333334,530.0 657.3333333333334,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="538.0" font-size="21" fill="#233734" font-weight="700">事实与维护责任</text>
<text x="669.3333333333334" y="568.0" font-size="18" fill="#53635f" font-weight="400">状态页面需要有人持续维护可信记录；采购或自建都承担支</text>
<text x="669.3333333333334" y="593.0" font-size="18" fill="#53635f" font-weight="400">持、恢复和数据迁移责任。</text>
<polyline points="639.3333333333334,530.0 639.3333333333334,659.0 657.3333333333334,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,645.0 658.3333333333334,742.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="667.0" font-size="21" fill="#286f64" font-weight="700">不可抵消的限制</text>
<text x="669.3333333333334" y="697.0" font-size="18" fill="#233734" font-weight="400">获准数据、人工路径和禁止未知承诺等条件须先满足；体验</text>
<text x="669.3333333333334" y="722.0" font-size="18" fill="#233734" font-weight="400">评分不能抵消违反条件。</text>
<polyline points="639.3333333333334,659.0 639.3333333333334,788.0 657.3333333333334,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="796.0" font-size="21" fill="#233734" font-weight="700">错误代价与自动化范围</text>
<text x="669.3333333333334" y="826.0" font-size="18" fill="#53635f" font-weight="400">比较错误影响、可发现性、拦截与接手能力；可只辅助起</text>
<text x="669.3333333333334" y="851.0" font-size="18" fill="#53635f" font-weight="400">草，把高影响承诺留给获授权者。</text>
<polyline points="1466.3333333333335,400.0 1466.3333333333335,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="465.0" font-size="23" fill="#286f64" font-weight="700">投入顺序与重新决定</text>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,530.0 1223.6666666666667,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="538.0" font-size="21" fill="#233734" font-weight="700">依赖与优先顺序</text>
<text x="1235.6666666666667" y="568.0" font-size="18" fill="#53635f" font-weight="400">承接事实支持可信查询，当前日程与授权支持确认；顺序来</text>
<text x="1235.6666666666667" y="593.0" font-size="18" fill="#53635f" font-weight="400">自条件，不仅来自投票和喜好。</text>
<polyline points="1205.6666666666667,530.0 1205.6666666666667,659.0 1223.6666666666667,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="667.0" font-size="21" fill="#233734" font-weight="700">机会成本</text>
<text x="1235.6666666666667" y="697.0" font-size="18" fill="#53635f" font-weight="400">同一人员或资源投入此项就不能同时用于别项；没有新增付</text>
<text x="1235.6666666666667" y="722.0" font-size="18" fill="#53635f" font-weight="400">款也存在被放弃的机会。</text>
<polyline points="1205.6666666666667,659.0 1205.6666666666667,788.0 1223.6666666666667,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="796.0" font-size="21" fill="#233734" font-weight="700">暂不做与重看条件</text>
<text x="1235.6666666666667" y="826.0" font-size="18" fill="#53635f" font-weight="400">说明当前行动、暂缓范围、依据和重新考虑条件；有界验证</text>
<text x="1235.6666666666667" y="851.0" font-size="18" fill="#53635f" font-weight="400">也是行动，不必等所有未知消失。</text>
<text x="64" y="915.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="915.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="940.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="973.0" font-size="21" fill="#233734" font-weight="700">有界改善目标</text>
<rect x="750" y="940.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="973.0" font-size="21" fill="#233734" font-weight="700">流程、采购、自建与 AI</text>
<polyline points="538,977.0 736,977.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,977.0 726.9955289764732,981.3496553411123 726.9955289764732,972.6503446588877" fill="#286f64"/>
<text x="586.0" y="965.0" font-size="17" fill="#286f64" font-weight="400">筛选合适办法</text>
<text x="80" y="1023.0" font-size="18" fill="#53635f" font-weight="400">同叫改善客服的方案，实际改变的位置不同，需按已观察限制取舍。</text>
<rect x="64" y="1063.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1096.2" font-size="21" fill="#233734" font-weight="700">事实与维护责任</text>
<rect x="750" y="1063.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1096.2" font-size="21" fill="#233734" font-weight="700">依赖与优先顺序</text>
<polyline points="538,1100.2 736,1100.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1100.2 726.9955289764732,1104.5496553411124 726.9955289764732,1095.8503446588877" fill="#286f64"/>
<text x="603.0" y="1088.2" font-size="17" fill="#286f64" font-weight="400">构成前提</text>
<text x="80" y="1146.2" font-size="18" fill="#53635f" font-weight="400">无人维护状态时先做页面可能只更清晰地展示旧信息。</text>
<rect x="64" y="1186.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1219.4" font-size="21" fill="#233734" font-weight="700">错误代价与自动化范围</text>
<rect x="750" y="1186.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1219.4" font-size="21" fill="#233734" font-weight="700">暂不做与重看条件</text>
<polyline points="538,1223.4 736,1223.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1223.4 726.9955289764732,1227.7496553411124 726.9955289764732,1219.0503446588878" fill="#286f64"/>
<text x="620.0" y="1211.4" font-size="17" fill="#286f64" font-weight="400">影响</text>
<text x="80" y="1269.4" font-size="18" fill="#53635f" font-weight="400">未知日程或缺少授权时，保留有意义的较小范围并登记以后重看条件。</text>
<rect x="64" y="1309.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1342.6000000000001" font-size="21" fill="#233734" font-weight="700">不可抵消的限制</text>
<rect x="750" y="1309.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1342.6000000000001" font-size="21" fill="#233734" font-weight="700">流程、采购、自建与 AI</text>
<polyline points="538,1346.6000000000001 736,1346.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1346.6000000000001 726.9955289764732,1350.9496553411125 726.9955289764732,1342.2503446588878" fill="#286f64"/>
<text x="569.0" y="1334.6000000000001" font-size="17" fill="#286f64" font-weight="400">排除不允许的选择</text>
<text x="80" y="1392.6000000000001" font-size="18" fill="#53635f" font-weight="400">数据或授权条件不成立时，更多功能或更高体验分也不能补上这些条件。</text>
<polyline points="64,1450.8000000000002 1736,1450.8000000000002" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1480.8000000000002" font-size="17" fill="#53635f" font-weight="400">对照正文：P06  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
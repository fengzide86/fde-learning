<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2148" width="1800" height="2148" role="img" aria-labelledby="title">
<title id="title">怎样保存和找回一份确定的代码？</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="2148" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">A / 程序与工具</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">A11  怎样保存和找回一份确定的代码？</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">A11把工作文件保存成明确的本地提交；A12将提交身份与新环境运行证据相连。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">编辑器保存工作区，add选择当时内容，commit保存暂存快照；比较、测试和恢复都要指明是哪一份。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="718.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">代码快照的选择、比较与恢复</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 1466.3333333333335,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,437.0 333.6666666666667,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">三份内容与交接</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,553.0 92.0,672.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="575.0" font-size="21" fill="#286f64" font-weight="700">工作区</text>
<text x="103.0" y="605.0" font-size="16" fill="#286f64" font-weight="400">当前文件内容</text>
<text x="103.0" y="627.0" font-size="18" fill="#233734" font-weight="400">编辑器保存和普通运行使用的文件内容；修改它不会自动改</text>
<text x="103.0" y="652.0" font-size="18" fill="#233734" font-weight="400">变暂存区或已提交历史。</text>
<polyline points="73.0,567.0 73.0,718.0 91.0,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="696.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,704.0 92.0,823.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="726.0" font-size="21" fill="#286f64" font-weight="700">选择下次提交内容（git add）</text>
<text x="103.0" y="756.0" font-size="16" fill="#286f64" font-weight="400">提交准备区与选择动作</text>
<text x="103.0" y="778.0" font-size="18" fill="#233734" font-weight="400">选择add执行当时的内容作为下一次提交准备；随后继续编</text>
<text x="103.0" y="803.0" font-size="18" fill="#233734" font-weight="400">辑会形成另一份未暂存内容。</text>
<polyline points="73.0,718.0 73.0,869.0 91.0,869.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="847.0" width="500.33333333333337" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,855.0 92.0,974.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="877.0" font-size="21" fill="#286f64" font-weight="700">保存暂存快照（commit / ID）</text>
<text x="103.0" y="907.0" font-size="16" fill="#286f64" font-weight="400">快照记录与身份</text>
<text x="103.0" y="929.0" font-size="18" fill="#233734" font-weight="400">按暂存区建立本地快照与历史身份；保存项目受管理内容，</text>
<text x="103.0" y="954.0" font-size="18" fill="#233734" font-weight="400">不仅是一段差异，也不自动上传。</text>
<polyline points="73.0,869.0 73.0,1020.0 91.0,1020.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="998.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="1028.0" font-size="21" fill="#233734" font-weight="700">当前所在提交（HEAD）</text>
<text x="103.0" y="1058.0" font-size="18" fill="#53635f" font-weight="400">在本章用来指示当前检出的提交；它会随检出或提交变化，</text>
<text x="103.0" y="1083.0" font-size="18" fill="#53635f" font-weight="400">不固定表示某个错误版本。</text>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="502.0" font-size="23" fill="#286f64" font-weight="700">比较与确认对象</text>
<polyline points="639.3333333333334,525.0 639.3333333333334,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,525.0 639.3333333333334,567.0 657.3333333333334,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="545.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="575.0" font-size="21" fill="#233734" font-weight="700">查看三处状态（git status）</text>
<text x="669.3333333333334" y="605.0" font-size="18" fill="#53635f" font-weight="400">展示路径状态；短格式左列比较提交与暂存，右列比较暂存</text>
<text x="669.3333333333334" y="630.0" font-size="18" fill="#53635f" font-weight="400">与工作区，??表示未跟踪。</text>
<polyline points="639.3333333333334,567.0 639.3333333333334,696.0 657.3333333333334,696.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="674.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="704.0" font-size="21" fill="#233734" font-weight="700">比较工作区与暂存区（diff）</text>
<text x="669.3333333333334" y="734.0" font-size="18" fill="#53635f" font-weight="400">普通diff比较暂存与工作区，staged比较当前提交与暂存；据</text>
<text x="669.3333333333334" y="759.0" font-size="18" fill="#53635f" font-weight="400">此看清下一次提交真正保存什么。</text>
<polyline points="639.3333333333334,696.0 639.3333333333334,825.0 657.3333333333334,825.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="803.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="833.0" font-size="21" fill="#233734" font-weight="700">查看提交历史与内容（log / show）</text>
<text x="669.3333333333334" y="863.0" font-size="18" fill="#53635f" font-weight="400">日志定位提交，show核对目标提交影响；提交ID不需背，恢</text>
<text x="669.3333333333334" y="888.0" font-size="18" fill="#53635f" font-weight="400">复前需确认具体内容。</text>
<polyline points="639.3333333333334,825.0 639.3333333333334,954.0 657.3333333333334,954.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="932.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="962.0" font-size="21" fill="#233734" font-weight="700">测试内容与待提交内容</text>
<text x="669.3333333333334" y="992.0" font-size="18" fill="#53635f" font-weight="400">普通测试读取工作区，暂存区可能仍是旧版；测试通过需与</text>
<text x="669.3333333333334" y="1017.0" font-size="18" fill="#53635f" font-weight="400">准备提交的那份内容对应。</text>
<polyline points="1466.3333333333335,437.0 1466.3333333333335,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="468.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="502.0" font-size="23" fill="#286f64" font-weight="700">恢复与历史整合</text>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,525.0 1205.6666666666667,567.0 1223.6666666666667,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="545.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="575.0" font-size="21" fill="#233734" font-weight="700">撤回暂存选择（restore --staged）</text>
<text x="1235.6666666666667" y="605.0" font-size="16" fill="#286f64" font-weight="400">改变暂存内容</text>
<text x="1235.6666666666667" y="627.0" font-size="18" fill="#53635f" font-weight="400">默认从当前提交恢复暂存区，保留工作区修改；取消待提交</text>
<text x="1235.6666666666667" y="652.0" font-size="18" fill="#53635f" font-weight="400">选择不等于丢弃编辑内容。</text>
<polyline points="1205.6666666666667,567.0 1205.6666666666667,718.0 1223.6666666666667,718.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="696.0" width="500.33333333333337" height="135" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="726.0" font-size="21" fill="#233734" font-weight="700">恢复文件到提交内容（restore）</text>
<text x="1235.6666666666667" y="756.0" font-size="16" fill="#286f64" font-weight="400">替换指定工作文件</text>
<text x="1235.6666666666667" y="778.0" font-size="18" fill="#53635f" font-weight="400">默认以暂存内容替换指定工作文件，丢弃对应未暂存修改；</text>
<text x="1235.6666666666667" y="803.0" font-size="18" fill="#53635f" font-weight="400">不会自动生成备份提交。</text>
<polyline points="1205.6666666666667,718.0 1205.6666666666667,869.0 1223.6666666666667,869.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="847.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="877.0" font-size="21" fill="#233734" font-weight="700">新增反向提交（revert）</text>
<text x="1235.6666666666667" y="907.0" font-size="18" fill="#53635f" font-weight="400">反向应用已核对提交的改变并创建新提交，保留旧历史；后</text>
<text x="1235.6666666666667" y="932.0" font-size="18" fill="#53635f" font-weight="400">续改动可能造成冲突。</text>
<polyline points="1205.6666666666667,869.0 1205.6666666666667,998.0 1223.6666666666667,998.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="976.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="1006.0" font-size="21" fill="#233734" font-weight="700">创建或切换分支（branch / switch）</text>
<text x="1235.6666666666667" y="1036.0" font-size="18" fill="#53635f" font-weight="400">分支是指向提交的名字，切换会检出对应内容；并非永久复</text>
<text x="1235.6666666666667" y="1061.0" font-size="18" fill="#53635f" font-weight="400">制文件，也不自动保存未提交改动。</text>
<polyline points="1205.6666666666667,998.0 1205.6666666666667,1127.0 1223.6666666666667,1127.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="1105.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="1135.0" font-size="21" fill="#233734" font-weight="700">合并并处理冲突（merge）</text>
<text x="1235.6666666666667" y="1165.0" font-size="18" fill="#53635f" font-weight="400">整合共同起点后的改变；冲突要按需求选最终内容、去标</text>
<text x="1235.6666666666667" y="1190.0" font-size="18" fill="#53635f" font-weight="400">记、验证，再暂存并提交。</text>
<text x="64" y="1254.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1254.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1279.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1312.0" font-size="21" fill="#233734" font-weight="700">工作区</text>
<rect x="750" y="1279.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1312.0" font-size="21" fill="#233734" font-weight="700">选择下次提交内容（git add）</text>
<polyline points="538,1316.0 736,1316.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1316.0 726.9955289764732,1320.3496553411123 726.9955289764732,1311.6503446588877" fill="#286f64"/>
<text x="577.5" y="1304.0" font-size="17" fill="#286f64" font-weight="400">按当时内容选入</text>
<text x="80" y="1362.0" font-size="18" fill="#53635f" font-weight="400">add后再编辑时，暂存区仍保留先前选择的版本。</text>
<rect x="64" y="1402.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1435.2" font-size="21" fill="#233734" font-weight="700">选择下次提交内容（git add）</text>
<rect x="750" y="1402.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1435.2" font-size="21" fill="#233734" font-weight="700">保存暂存快照（commit / ID）</text>
<polyline points="538,1439.2 736,1439.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1439.2 726.9955289764732,1443.5496553411124 726.9955289764732,1434.8503446588877" fill="#286f64"/>
<text x="586.0" y="1427.2" font-size="17" fill="#286f64" font-weight="400">作为快照来源</text>
<text x="80" y="1485.2" font-size="18" fill="#53635f" font-weight="400">普通commit不会自动加入未暂存文件和未跟踪文件。</text>
<rect x="64" y="1525.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1558.4" font-size="21" fill="#233734" font-weight="700">比较工作区与暂存区（diff）</text>
<rect x="750" y="1525.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1558.4" font-size="21" fill="#233734" font-weight="700">测试内容与待提交内容</text>
<polyline points="538,1562.4 736,1562.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1562.4 726.9955289764732,1566.7496553411124 726.9955289764732,1558.0503446588878" fill="#286f64"/>
<text x="569.0" y="1550.4" font-size="17" fill="#286f64" font-weight="400">核对两份是否一致</text>
<text x="80" y="1608.4" font-size="18" fill="#53635f" font-weight="400">运行工作区通过，不能自动证明不同的暂存内容通过。</text>
<rect x="64" y="1648.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1681.6000000000001" font-size="21" fill="#233734" font-weight="700">查看提交历史与内容（log / show）</text>
<rect x="750" y="1648.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1681.6000000000001" font-size="21" fill="#233734" font-weight="700">新增反向提交（revert）</text>
<polyline points="538,1685.6000000000001 736,1685.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1685.6000000000001 726.9955289764732,1689.9496553411125 726.9955289764732,1681.2503446588878" fill="#286f64"/>
<text x="569.0" y="1673.6000000000001" font-size="17" fill="#286f64" font-weight="400">定位反向改变对象</text>
<text x="80" y="1731.6000000000001" font-size="18" fill="#53635f" font-weight="400">先确认目标提交及影响，再保存纠正经过；与恢复未提交文件是不同动作。</text>
<rect x="64" y="1771.8000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1804.8000000000002" font-size="21" fill="#233734" font-weight="700">撤回暂存选择（restore --staged）</text>
<rect x="750" y="1771.8000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1804.8000000000002" font-size="21" fill="#233734" font-weight="700">选择下次提交内容（git add）</text>
<polyline points="538,1808.8000000000002 736,1808.8000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1808.8000000000002 726.9955289764732,1813.1496553411125 726.9955289764732,1804.4503446588878" fill="#286f64"/>
<text x="577.5" y="1796.8000000000002" font-size="17" fill="#286f64" font-weight="400">只改变提交准备</text>
<text x="80" y="1854.8000000000002" font-size="18" fill="#53635f" font-weight="400">默认取HEAD内容恢复暂存区，工作区新修改保留；不是丢弃编辑器里的内容。</text>
<rect x="64" y="1895.0000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1928.0000000000002" font-size="21" fill="#233734" font-weight="700">恢复文件到提交内容（restore）</text>
<rect x="750" y="1895.0000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1928.0000000000002" font-size="21" fill="#233734" font-weight="700">工作区</text>
<polyline points="538,1932.0000000000002 736,1932.0000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1932.0000000000002 726.9955289764732,1936.3496553411126 726.9955289764732,1927.650344658888" fill="#286f64"/>
<text x="577.5" y="1920.0000000000002" font-size="17" fill="#286f64" font-weight="400">从暂存内容替换</text>
<text x="80" y="1978.0000000000002" font-size="18" fill="#53635f" font-weight="400">执行前核对路径和diff；未暂存修改会被丢弃，不自动得到备份。</text>

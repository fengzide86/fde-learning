<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1697" width="1800" height="1697" role="img" aria-labelledby="title">
<title id="title">可靠性关系的组合验证</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1697" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">D / 外部依赖可靠性</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">D05  可靠性关系的组合验证</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">综合 D01–D04 的不同保护关系；通过相同意图的可重复实验核对协作，为E册更强的内容与权限约束铺底。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">把调用次数、合作方实际效果和本地状态一起核对；同意图恢复、结果复用与内容冲突应留下不同证据。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">主图 · 先把关键关系接起来</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="622.0" y="343.0" width="556.0" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="662.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">调用、远端效果与本地状态的联合核对</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,437.0 1537.125,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,437.0 262.875,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">输入与跨边界身份</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="575.0" font-size="21" fill="#233734" font-weight="700">本地输入与 provider payload</text>
<text x="103.0" y="605.0" font-size="18" fill="#53635f" font-weight="400">本地输入含意图身份，外发业务内容保留</text>
<text x="103.0" y="630.0" font-size="18" fill="#53635f" font-weight="400">案件、类别、摘要及优先级；意图通过幂</text>
<text x="103.0" y="655.0" font-size="18" fill="#53635f" font-weight="400">等头关联。</text>
<polyline points="73.0,567.0 73.0,721.0 91.0,721.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="699.0" width="358.75" height="138" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,707.0 92.0,829.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="729.0" font-size="21" fill="#286f64" font-weight="700">持久不可变意图</text>
<text x="103.0" y="759.0" font-size="18" fill="#233734" font-weight="400">保存合同版本、完整规范输入、摘要和稳</text>
<text x="103.0" y="784.0" font-size="18" fill="#233734" font-weight="400">定键；相同意图拒绝内容变化，新业务另</text>
<text x="103.0" y="809.0" font-size="18" fill="#233734" font-weight="400">建意图保留旧记录。</text>
<polyline points="73.0,721.0 73.0,875.0 91.0,875.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="853.0" width="358.75" height="160" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="883.0" font-size="21" fill="#233734" font-weight="700">请求与尝试标识（request ID / attempt）</text>
<text x="103.0" y="913.0" font-size="16" fill="#286f64" font-weight="400">处理与发送身份</text>
<text x="103.0" y="935.0" font-size="18" fill="#53635f" font-weight="400">请求标识关联本次处理，attempt区分内部</text>
<text x="103.0" y="960.0" font-size="18" fill="#53635f" font-weight="400">发送；再次处理同意图可用新请求ID而不</text>
<text x="103.0" y="985.0" font-size="18" fill="#53635f" font-weight="400">换键。</text>
<polyline points="687.625,437.0 687.625,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="488.75" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="502.75" y="502.0" font-size="23" fill="#286f64" font-weight="700">去重与恢复保护</text>
<polyline points="497.75,525.0 497.75,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="497.75,525.0 497.75,567.0 515.75,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="545.0" width="358.75" height="138" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="516.75,553.0 516.75,675.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="527.75" y="575.0" font-size="21" fill="#286f64" font-weight="700">合作方原始结果复用（provider）</text>
<text x="527.75" y="605.0" font-size="18" fill="#233734" font-weight="400">合作方首次提交后丢回复，再按原键返回</text>
<text x="527.75" y="630.0" font-size="18" fill="#233734" font-weight="400">原案件；两次传输应仍只有一次创建效</text>
<text x="527.75" y="655.0" font-size="18" fill="#233734" font-weight="400">果。</text>
<polyline points="497.75,567.0 497.75,721.0 515.75,721.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="699.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="729.0" font-size="21" fill="#233734" font-weight="700">本地已确认结果复用</text>
<text x="527.75" y="759.0" font-size="18" fill="#53635f" font-weight="400">同意图同输入已确认时直接返回本地结</text>
<text x="527.75" y="784.0" font-size="18" fill="#53635f" font-weight="400">果，不再调用合作方；与合作方收到后去</text>
<text x="527.75" y="809.0" font-size="18" fill="#53635f" font-weight="400">重是两道保护。</text>
<polyline points="497.75,721.0 497.75,875.0 515.75,875.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="853.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="883.0" font-size="21" fill="#233734" font-weight="700">确认故障与受控重放</text>
<text x="527.75" y="913.0" font-size="18" fill="#53635f" font-weight="400">本地确认写失败仍保留完整pending；新</text>
<text x="527.75" y="938.0" font-size="18" fill="#53635f" font-weight="400">POST可用原输入和键恢复，缺材料时停止</text>
<text x="527.75" y="963.0" font-size="18" fill="#53635f" font-weight="400">自动发送。</text>
<polyline points="1112.375,437.0 1112.375,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="913.5" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="927.5" y="502.0" font-size="23" fill="#286f64" font-weight="700">公开合同与决策</text>
<polyline points="922.5,525.0 922.5,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="922.5,525.0 922.5,567.0 940.5,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="545.0" width="358.75" height="160" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="575.0" font-size="21" fill="#233734" font-weight="700">传输状态与业务状态（HTTP）</text>
<text x="952.5" y="605.0" font-size="16" fill="#286f64" font-weight="400">不同层面的结果</text>
<text x="952.5" y="627.0" font-size="18" fill="#53635f" font-weight="400">本次确认201、复用200、已存接管202、</text>
<text x="952.5" y="652.0" font-size="18" fill="#53635f" font-weight="400">意图冲突409、输入422各有边界，不混同</text>
<text x="952.5" y="677.0" font-size="18" fill="#53635f" font-weight="400">远端回应。</text>
<polyline points="922.5,567.0 922.5,743.0 940.5,743.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="721.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="751.0" font-size="21" fill="#233734" font-weight="700">错误类别与有限重试</text>
<text x="952.5" y="781.0" font-size="18" fill="#53635f" font-weight="400">配套只对超时及指定5xx有限重试；认证、</text>
<text x="952.5" y="806.0" font-size="18" fill="#53635f" font-weight="400">冲突、拒绝和内容错误停止，由一处负责</text>
<text x="952.5" y="831.0" font-size="18" fill="#53635f" font-weight="400">次数。</text>
<polyline points="922.5,743.0 922.5,897.0 940.5,897.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="875.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="905.0" font-size="21" fill="#233734" font-weight="700">只读 GET 与最新意图</text>
<text x="952.5" y="935.0" font-size="18" fill="#53635f" font-weight="400">GET按创建次序读取本地最新意图，可能</text>
<text x="952.5" y="960.0" font-size="18" fill="#53635f" font-weight="400">见pending；不触发恢复，也不删除旧记</text>
<text x="952.5" y="985.0" font-size="18" fill="#53635f" font-weight="400">录。</text>
<polyline points="1537.125,437.0 1537.125,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1338.25" y="468.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1352.25" y="502.0" font-size="23" fill="#286f64" font-weight="700">验证维度与事实边界</text>
<polyline points="1347.25,525.0 1347.25,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1347.25,525.0 1347.25,567.0 1365.25,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="545.0" width="358.75" height="160" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="1366.25,553.0 1366.25,697.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="1377.25" y="575.0" font-size="21" fill="#286f64" font-weight="700">调用、效果、状态矩阵</text>
<text x="1377.25" y="605.0" font-size="16" fill="#286f64" font-weight="400">联合验证维度</text>
<text x="1377.25" y="627.0" font-size="18" fill="#233734" font-weight="400">分别核对输入失败零调用、两传一次效果</text>
<text x="1377.25" y="652.0" font-size="18" fill="#233734" font-weight="400">及未知出口；坏字段和迟到可已产生远端</text>
<text x="1377.25" y="677.0" font-size="18" fill="#233734" font-weight="400">效果。</text>
<polyline points="1347.25,567.0 1347.25,743.0 1365.25,743.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="721.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="751.0" font-size="21" fill="#233734" font-weight="700">两库、虚拟时钟与替身</text>
<text x="1377.25" y="781.0" font-size="18" fill="#53635f" font-weight="400">分开保存本地状态和合作方效果并固定时</text>
<text x="1377.25" y="806.0" font-size="18" fill="#53635f" font-weight="400">间分支；临时实验不证明真实网络、并发</text>
<text x="1377.25" y="831.0" font-size="18" fill="#53635f" font-weight="400">或宕机恢复。</text>
<text x="64" y="1049.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1049.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1074.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1107.0" font-size="21" fill="#233734" font-weight="700">合作方原始结果复用（provider）</text>
<rect x="750" y="1074.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1107.0" font-size="21" fill="#233734" font-weight="700">本地已确认结果复用</text>
<polyline points="538,1111.0 736,1111.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1111.0 726.9955289764732,1115.3496553411123 726.9955289764732,1106.6503446588877" fill="#286f64"/>
<text x="577.5" y="1099.0" font-size="17" fill="#286f64" font-weight="400">与本地复用互补</text>
<text x="80" y="1157.0" font-size="18" fill="#53635f" font-weight="400">前者处理已经发生的重传，后者阻止不必要的外发；不能把调用数变化混作同一道去重。</text>
<rect x="64" y="1197.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1230.2" font-size="21" fill="#233734" font-weight="700">持久不可变意图</text>
<rect x="750" y="1197.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1230.2" font-size="21" fill="#233734" font-weight="700">确认故障与受控重放</text>
<polyline points="538,1234.2 736,1234.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1234.2 726.9955289764732,1238.5496553411124 726.9955289764732,1229.8503446588877" fill="#286f64"/>
<text x="577.5" y="1222.2" font-size="17" fill="#286f64" font-weight="400">支持原动作恢复</text>
<text x="80" y="1280.2" font-size="18" fill="#53635f" font-weight="400">本地写入失败后仍须从保存的输入和原键继续，摘要单独存在不能重建请求。</text>
<rect x="64" y="1320.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1353.4" font-size="21" fill="#233734" font-weight="700">错误类别与有限重试</text>
<rect x="750" y="1320.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1353.4" font-size="21" fill="#233734" font-weight="700">调用、效果、状态矩阵</text>
<polyline points="538,1357.4 736,1357.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1357.4 726.9955289764732,1361.7496553411124 726.9955289764732,1353.0503446588878" fill="#286f64"/>
<text x="577.5" y="1345.4" font-size="17" fill="#286f64" font-weight="400">用多维状态验证</text>
<text x="80" y="1403.4" font-size="18" fill="#53635f" font-weight="400">减少尝试不会擦除已提交的远端效果；判断必须同时看发送数、效果数和本地状态。</text>
<rect x="64" y="1443.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1476.6000000000001" font-size="21" fill="#233734" font-weight="700">请求与尝试标识（request ID / attempt）</text>
<rect x="750" y="1443.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1476.6000000000001" font-size="21" fill="#233734" font-weight="700">持久不可变意图</text>
<polyline points="538,1480.6000000000001 736,1480.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1480.6000000000001 726.9955289764732,1484.9496553411125 726.9955289764732,1476.2503446588878" fill="#286f64"/>
<text x="569.0" y="1468.6000000000001" font-size="17" fill="#286f64" font-weight="400">不能替代业务身份</text>
<text x="80" y="1526.6000000000001" font-size="18" fill="#53635f" font-weight="400">同一意图可以由新 request ID 再处理；本次 attempt 增加，不应重建输入或换幂等键。</text>
<text x="64" y="1578.8000000000002" font-size="19" fill="#53635f" font-weight="400">同章续图：配置、秘密与运行边界。后页继续展开；分面不表示它们不属于本章。</text>
<polyline points="64,1641.4 1736,1641.4" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1671.4" font-size="17" fill="#53635f" font-weight="400">对照正文：D05  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
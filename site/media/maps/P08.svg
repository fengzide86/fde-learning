<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1512" width="1800" height="1512" role="img" aria-labelledby="title">
<title id="title">行为约定与验收</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1512" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">P / 产品与业务</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">P08  行为约定与验收</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">将前面的有界选择说成可执行、可观察的约定；为 P09 页面理解和 P10 验证明确对象。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">需求约定应说明谁在什么条件下可以做什么，并用可观察结果核对是否遵守。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="732.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">让协作共享行为与结果含义</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 1466.3333333333335,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="333.6666666666667,400.0 333.6666666666667,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">目标与业务约定</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="538.0" font-size="21" fill="#233734" font-weight="700">目标与范围边界</text>
<text x="103.0" y="568.0" font-size="18" fill="#53635f" font-weight="400">说明客户应能作出什么判断，并明确不包含的承诺；目标不</text>
<text x="103.0" y="593.0" font-size="18" fill="#53635f" font-weight="400">必预先指定聊天或进度条。</text>
<polyline points="73.0,530.0 73.0,659.0 91.0,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,645.0 92.0,742.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="667.0" font-size="21" fill="#286f64" font-weight="700">承接与更新责任</text>
<text x="103.0" y="697.0" font-size="18" fill="#233734" font-weight="400">约定发送后谁继续关注、谁确认接手、谁按时说明；无人承</text>
<text x="103.0" y="722.0" font-size="18" fill="#233734" font-weight="400">接或逾时须有明确升级去向。</text>
<polyline points="73.0,659.0 73.0,788.0 91.0,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,774.0 92.0,871.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="796.0" font-size="21" fill="#286f64" font-weight="700">偏好与正式确认</text>
<text x="103.0" y="826.0" font-size="18" fill="#233734" font-weight="400">客户提交时段仅表达意愿；有权人员须按当时日程核实后确</text>
<text x="103.0" y="851.0" font-size="18" fill="#233734" font-weight="400">认，冲突时保留偏好再协调。</text>
<polyline points="900.0,400.0 900.0,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="630.3333333333334" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="644.3333333333334" y="465.0" font-size="23" fill="#286f64" font-weight="700">可观察的行为</text>
<polyline points="639.3333333333334,488.0 639.3333333333334,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="639.3333333333334,488.0 639.3333333333334,530.0 657.3333333333334,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="658.3333333333334,516.0 658.3333333333334,613.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="669.3333333333334" y="538.0" font-size="21" fill="#286f64" font-weight="700">用户故事与验收依据</text>
<text x="669.3333333333334" y="568.0" font-size="18" fill="#233734" font-weight="400">使用者、动作和目的帮助表达需要；仍须用具体情境说明怎</text>
<text x="669.3333333333334" y="593.0" font-size="18" fill="#233734" font-weight="400">样才算遵守行为约定。</text>
<polyline points="639.3333333333334,530.0 639.3333333333334,659.0 657.3333333333334,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="667.0" font-size="21" fill="#233734" font-weight="700">失败与权限情境</text>
<text x="669.3333333333334" y="697.0" font-size="18" fill="#53635f" font-weight="400">覆盖未承接、时段冲突、越权和取数失败；隐藏按钮不能代</text>
<text x="669.3333333333334" y="722.0" font-size="18" fill="#53635f" font-weight="400">替真正读取或写入处的权限限制。</text>
<polyline points="639.3333333333334,659.0 639.3333333333334,788.0 657.3333333333334,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="796.0" font-size="21" fill="#233734" font-weight="700">质量要求与测量条件</text>
<text x="669.3333333333334" y="826.0" font-size="18" fill="#53635f" font-weight="400">速度、可靠性、隐私和可访问性应联系设备、网络、任务与</text>
<text x="669.3333333333334" y="851.0" font-size="18" fill="#53635f" font-weight="400">成本；孤立秒数不足以形成要求。</text>
<polyline points="639.3333333333334,788.0 639.3333333333334,917.0 657.3333333333334,917.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="657.3333333333334" y="895.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="669.3333333333334" y="925.0" font-size="21" fill="#233734" font-weight="700">事实时间与获取时间</text>
<text x="669.3333333333334" y="955.0" font-size="18" fill="#53635f" font-weight="400">页面刚取得记录不等于事实刚核实；显示旧信息要说明限</text>
<text x="669.3333333333334" y="980.0" font-size="18" fill="#53635f" font-weight="400">制，正式确认仍需当前检查。</text>
<polyline points="1466.3333333333335,400.0 1466.3333333333335,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1196.6666666666667" y="431.0" width="539.3333333333334" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1210.6666666666667" y="465.0" font-size="23" fill="#286f64" font-weight="700">变化如何影响共同约定</text>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1205.6666666666667,488.0 1205.6666666666667,530.0 1223.6666666666667,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="508.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="538.0" font-size="21" fill="#233734" font-weight="700">依赖与未知</text>
<text x="1235.6666666666667" y="568.0" font-size="18" fill="#53635f" font-weight="400">现有系统给不出必要事实时登记依赖并调整范围；不能让实</text>
<text x="1235.6666666666667" y="593.0" font-size="18" fill="#53635f" font-weight="400">现者用猜测补齐业务结果。</text>
<polyline points="1205.6666666666667,530.0 1205.6666666666667,659.0 1223.6666666666667,659.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="637.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="667.0" font-size="21" fill="#233734" font-weight="700">变更影响追踪</text>
<text x="1235.6666666666667" y="697.0" font-size="18" fill="#53635f" font-weight="400">从原理由重看权限、当前事实、状态、异常和验收；改成功</text>
<text x="1235.6666666666667" y="722.0" font-size="18" fill="#53635f" font-weight="400">文案也可能实际扩大承诺。</text>
<polyline points="1205.6666666666667,659.0 1205.6666666666667,788.0 1223.6666666666667,788.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1223.6666666666667" y="766.0" width="500.33333333333337" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1235.6666666666667" y="796.0" font-size="21" fill="#233734" font-weight="700">取消结果的拆分</text>
<text x="1235.6666666666667" y="826.0" font-size="18" fill="#53635f" font-weight="400">收到取消请求、停止排程、终止出车和处理费用可能不同</text>
<text x="1235.6666666666667" y="851.0" font-size="18" fill="#53635f" font-weight="400">步；先界定结果再设计反馈。</text>
<text x="64" y="1044.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1044.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1069.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1102.0" font-size="21" fill="#233734" font-weight="700">目标与范围边界</text>
<rect x="750" y="1069.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1102.0" font-size="21" fill="#233734" font-weight="700">用户故事与验收依据</text>
<polyline points="538,1106.0 736,1106.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1106.0 726.9955289764732,1110.3496553411123 726.9955289764732,1101.6503446588877" fill="#286f64"/>
<text x="611.5" y="1094.0" font-size="17" fill="#286f64" font-weight="400">落实为</text>
<text x="80" y="1152.0" font-size="18" fill="#53635f" font-weight="400">目的需变成可观察行为，验收通过仍不自动证明看得懂或业务收益。</text>
<rect x="64" y="1192.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1225.2" font-size="21" fill="#233734" font-weight="700">事实时间与获取时间</text>
<rect x="750" y="1192.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1225.2" font-size="21" fill="#233734" font-weight="700">偏好与正式确认</text>
<polyline points="538,1229.2 736,1229.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1229.2 726.9955289764732,1233.5496553411124 726.9955289764732,1224.8503446588877" fill="#286f64"/>
<text x="586.0" y="1217.2" font-size="17" fill="#286f64" font-weight="400">限制成立条件</text>
<text x="80" y="1275.2" font-size="18" fill="#53635f" font-weight="400">可选时段可能过时，读取迅速不等于执行确认时仍然可用。</text>
<rect x="64" y="1315.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1348.4" font-size="21" fill="#233734" font-weight="700">变更影响追踪</text>
<rect x="750" y="1315.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1348.4" font-size="21" fill="#233734" font-weight="700">失败与权限情境</text>
<polyline points="538,1352.4 736,1352.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1352.4 726.9955289764732,1356.7496553411124 726.9955289764732,1348.0503446588878" fill="#286f64"/>
<text x="603.0" y="1340.4" font-size="17" fill="#286f64" font-weight="400">重新核对</text>
<text x="80" y="1398.4" font-size="18" fill="#53635f" font-weight="400">将收到偏好改称已确认会触及授权与冲突处理，不能仅按文案修改验收。</text>
<polyline points="64,1456.6000000000001 1736,1456.6000000000001" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1486.6000000000001" font-size="17" fill="#53635f" font-weight="400">对照正文：P08  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
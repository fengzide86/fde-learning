<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1099" width="1800" height="1099" role="img" aria-labelledby="title">
<title id="title">相同失败码与不同事实</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1099" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">X / 一套应用怎样连接起来</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">X02  相同失败码与不同事实</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">在 X01 两笔事务之间寻找最早偏离；复用 B 的交换边界、C 的提交事实和D的稳定意图，避免只凭状态码重试。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">这里单独展开另一组关系，便于看清归属与交接；分面本身不表示选修或可以省略。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">续图 · 与主图共同构成本章关系</text>
<text x="64" y="315.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="315.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="343.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="690.0" y="386.0" font-size="28" fill="#286f64" font-weight="700">依据持久状态区分失败与恢复位置</text>
<polyline points="900.0,408.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="900.0,437.0 900.0,437.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="900.0,437.0 900.0,468.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="468.0" width="1672.0" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="502.0" font-size="23" fill="#286f64" font-weight="700">其他入口与独立分支</text>
<polyline points="73.0,525.0 73.0,560.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,525.0 73.0,567.0 91.0,567.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="545.0" width="1633.0" height="88" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="575.0" font-size="21" fill="#233734" font-weight="700">无请求、无回应与422</text>
<text x="103.0" y="605.0" font-size="18" fill="#53635f" font-weight="400">客户端转换失败、连接异常和API输入拒绝发生在不同位置；只查与已有证据对应的下一边界。</text>
<polyline points="73.0,567.0 73.0,671.0 91.0,671.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="649.0" width="1633.0" height="88" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="679.0" font-size="21" fill="#233734" font-weight="700">政策失败与工单事实</text>
<text x="103.0" y="709.0" font-size="18" fill="#53635f" font-weight="400">HTTP200可携带不可采用的候选；坏引用或越权不删除已存工单，也不允许工具执行。</text>
<polyline points="73.0,671.0 73.0,775.0 91.0,775.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="753.0" width="1633.0" height="88" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="783.0" font-size="21" fill="#233734" font-weight="700">存活与结构就绪（live / schema readiness）</text>
<text x="103.0" y="813.0" font-size="18" fill="#53635f" font-weight="400">进程可回答存活检查，但期望与实际schema不符时不就绪并阻止写入；原因码属于当前应用。</text>
<text x="64" y="877.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="877.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="902.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="935.0" font-size="21" fill="#233734" font-weight="700">无请求、无回应与422</text>
<rect x="750" y="902.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="935.0" font-size="21" fill="#233734" font-weight="700">创建前数据条件失败（见主图）</text>
<polyline points="538,939.0 736,939.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,939.0 726.9955289764732,943.3496553411123 726.9955289764732,934.6503446588877" fill="#286f64"/>
<text x="569.0" y="927.0" font-size="17" fill="#286f64" font-weight="400">帮助定位最早边界</text>
<text x="80" y="985.0" font-size="18" fill="#53635f" font-weight="400">转换未发请求、没有 HTTP 回应、输入被拒绝与输入通过后的数据条件失败，各自需要不同证据。</text>
<polyline points="64,1043.2 1736,1043.2" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1073.2" font-size="17" fill="#53635f" font-weight="400">对照正文：X02  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
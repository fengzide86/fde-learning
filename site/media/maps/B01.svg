<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1850" width="1800" height="1850" role="img" aria-labelledby="title">
<title id="title">HTTP 消息与接口约定</title>
<desc>实线用于知识归组，不是执行顺序；带文字的箭头说明实际联系。强调色标出读图主线，不代表其余内容不重要。</desc>
<style>text {font-family:DengXian,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1800" height="1850" fill="white"/>
<text x="64" y="51" font-size="20" fill="#286f64" font-weight="700">B / HTTP 与 API</text>
<text x="64" y="99" font-size="34" fill="#233734" font-weight="700">B01  HTTP 消息与接口约定</text>
<text x="64" y="149.0" font-size="20" fill="#53635f" font-weight="400">把 A 册的进程内函数和值，扩展为跨进程的请求与响应；B02、B03分别展开接收与调用。</text>
<rect x="64" y="189.0" width="1672" height="56" rx="5" fill="#eaf2ee" stroke="#eaf2ee"/>
<text x="88" y="221.0" font-size="23" fill="#286f64" font-weight="700">API 约定怎样使用能力；HTTP 组织请求与响应；JSON 只表示其中的数据，三者配合但不是同一种东西。</text>
<text x="64" y="278.0" font-size="22" fill="#286f64" font-weight="700">知识归类</text>
<text x="192" y="278.0" font-size="17" fill="#53635f" font-weight="400">实线表示按本章关注点归组，不表示先后执行，也不是唯一分类。</text>
<rect x="640.0" y="306.0" width="520" height="65" rx="8" fill="#eaf2ee" stroke="#286f64"/>
<text x="718.0" y="349.0" font-size="28" fill="#286f64" font-weight="700">两个程序交换数据的共同约定</text>
<polyline points="900.0,371.0 900.0,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,400.0 1537.125,400.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polyline points="262.875,400.0 262.875,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="64.0" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="78.0" y="465.0" font-size="23" fill="#286f64" font-weight="700">协议与参与者</text>
<polyline points="73.0,488.0 73.0,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="73.0,488.0 73.0,530.0 91.0,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="508.0" width="358.75" height="160" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,516.0 92.0,660.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="538.0" font-size="21" fill="#286f64" font-weight="700">能力使用约定（API）</text>
<text x="103.0" y="568.0" font-size="16" fill="#286f64" font-weight="400">使用合同</text>
<text x="103.0" y="590.0" font-size="18" fill="#233734" font-weight="400">规定能力的动作、输入、结果及失败方</text>
<text x="103.0" y="615.0" font-size="18" fill="#233734" font-weight="400">式；接口不只是网址，也不一定使用 </text>
<text x="103.0" y="640.0" font-size="18" fill="#233734" font-weight="400">HTTP。</text>
<polyline points="73.0,530.0 73.0,706.0 91.0,706.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="684.0" width="358.75" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="92.0,692.0 92.0,811.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="103.0" y="714.0" font-size="21" fill="#286f64" font-weight="700">消息交换格式（HTTP）</text>
<text x="103.0" y="744.0" font-size="16" fill="#286f64" font-weight="400">交换消息</text>
<text x="103.0" y="766.0" font-size="18" fill="#233734" font-weight="400">以请求和响应组织一次交接；客户端发</text>
<text x="103.0" y="791.0" font-size="18" fill="#233734" font-weight="400">起，服务端回答，角色取决于当前交互。</text>
<polyline points="73.0,706.0 73.0,857.0 91.0,857.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="91.0" y="835.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="103.0" y="865.0" font-size="21" fill="#233734" font-weight="700">请求结果标记（HTTP状态码）</text>
<text x="103.0" y="895.0" font-size="18" fill="#53635f" font-weight="400">说明这次请求处理结果；不同于工单业务</text>
<text x="103.0" y="920.0" font-size="18" fill="#53635f" font-weight="400">状态，也不同于程序退出码。</text>
<polyline points="687.625,400.0 687.625,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="488.75" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="502.75" y="465.0" font-size="23" fill="#286f64" font-weight="700">目标与动作</text>
<polyline points="497.75,488.0 497.75,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="497.75,488.0 497.75,530.0 515.75,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="508.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="538.0" font-size="21" fill="#233734" font-weight="700">服务目标地址（URL）</text>
<text x="527.75" y="568.0" font-size="18" fill="#53635f" font-weight="400">scheme、host、port选服务入口；path指</text>
<text x="527.75" y="593.0" font-size="18" fill="#53635f" font-weight="400">资源，query调整本次读取，均非磁盘路</text>
<text x="527.75" y="618.0" font-size="18" fill="#53635f" font-weight="400">径。</text>
<polyline points="497.75,530.0 497.75,684.0 515.75,684.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="662.0" width="358.75" height="160" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="692.0" font-size="21" fill="#233734" font-weight="700">请求动作（HTTP method）</text>
<text x="527.75" y="722.0" font-size="16" fill="#286f64" font-weight="400">请求动作</text>
<text x="527.75" y="744.0" font-size="18" fill="#53635f" font-weight="400">GET读取、POST在本例创建；PUT、</text>
<text x="527.75" y="769.0" font-size="18" fill="#53635f" font-weight="400">PATCH、DELETE表达其他动作，能否调用</text>
<text x="527.75" y="794.0" font-size="18" fill="#53635f" font-weight="400">由接口决定。</text>
<polyline points="497.75,684.0 497.75,860.0 515.75,860.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="515.75" y="838.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="527.75" y="868.0" font-size="21" fill="#233734" font-weight="700">重复调用性质（safe / 幂等）</text>
<text x="527.75" y="898.0" font-size="18" fill="#53635f" font-weight="400">safe约束预期资源改变；幂等约束重复效</text>
<text x="527.75" y="923.0" font-size="18" fill="#53635f" font-weight="400">果，不保证回应相同，POST和PATCH无普</text>
<text x="527.75" y="948.0" font-size="18" fill="#53635f" font-weight="400">遍保证。</text>
<polyline points="1112.375,400.0 1112.375,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="913.5" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="927.5" y="465.0" font-size="23" fill="#286f64" font-weight="700">内容表示与附加信息</text>
<polyline points="922.5,488.0 922.5,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="922.5,488.0 922.5,530.0 940.5,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="508.0" width="358.75" height="135" rx="5" fill="#eaf2ee" stroke="#286f64"/>
<polyline points="941.5,516.0 941.5,635.0" fill="none" stroke="#286f64" stroke-width="4"/>
<text x="952.5" y="538.0" font-size="21" fill="#286f64" font-weight="700">数据表示与转换（JSON）</text>
<text x="952.5" y="568.0" font-size="16" fill="#286f64" font-weight="400">数据表示与转换</text>
<text x="952.5" y="590.0" font-size="18" fill="#233734" font-weight="400">将本地值表示为可传输内容；解析产生接</text>
<text x="952.5" y="615.0" font-size="18" fill="#233734" font-weight="400">收方自己的值，JSON顶层不一定是对象。</text>
<polyline points="922.5,530.0 922.5,681.0 940.5,681.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="659.0" width="358.75" height="113" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="689.0" font-size="21" fill="#233734" font-weight="700">消息内容与附加信息（body / headers）</text>
<text x="952.5" y="719.0" font-size="18" fill="#53635f" font-weight="400">body携带主要数据；headers提供内容类</text>
<text x="952.5" y="744.0" font-size="18" fill="#53635f" font-weight="400">型、身份与处理上下文，不能互相代替。</text>
<polyline points="922.5,681.0 922.5,810.0 940.5,810.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="940.5" y="788.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="952.5" y="818.0" font-size="21" fill="#233734" font-weight="700">内容类型与期望（Content-Type / Accept）</text>
<text x="952.5" y="848.0" font-size="18" fill="#53635f" font-weight="400">前者声明当前正文类型，后者表达希望接</text>
<text x="952.5" y="873.0" font-size="18" fill="#53635f" font-weight="400">收的类型；声明和希望都不保证实际内容</text>
<text x="952.5" y="898.0" font-size="18" fill="#53635f" font-weight="400">正确。</text>
<polyline points="1537.125,400.0 1537.125,431.0" fill="none" stroke="#286f64" stroke-width="2"/>
<rect x="1338.25" y="431.0" width="397.75" height="57" rx="8" fill="#eaf2ee" stroke="#a9bab4"/>
<text x="1352.25" y="465.0" font-size="23" fill="#286f64" font-weight="700">观察与可用性</text>
<polyline points="1347.25,488.0 1347.25,523.0" fill="none" stroke="#a9bab4" stroke-width="2"/>
<polyline points="1347.25,488.0 1347.25,530.0 1365.25,530.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="508.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="538.0" font-size="21" fill="#233734" font-weight="700">状态与内容联合检查</text>
<text x="1377.25" y="568.0" font-size="18" fill="#53635f" font-weight="400">成功状态后仍要检查媒体类型、实际格式</text>
<text x="1377.25" y="593.0" font-size="18" fill="#53635f" font-weight="400">及字段；任何单项都不能独证业务结果可</text>
<text x="1377.25" y="618.0" font-size="18" fill="#53635f" font-weight="400">用。</text>
<polyline points="1347.25,530.0 1347.25,684.0 1365.25,684.0" fill="none" stroke="#a9bab4" stroke-width="1.5"/>
<rect x="1365.25" y="662.0" width="358.75" height="138" rx="5" fill="#ffffff" stroke="#d7e0db"/>
<text x="1377.25" y="692.0" font-size="21" fill="#233734" font-weight="700">交互文档与 Network</text>
<text x="1377.25" y="722.0" font-size="18" fill="#53635f" font-weight="400">文档帮助构造请求，Network核对浏览器</text>
<text x="1377.25" y="747.0" font-size="18" fill="#53635f" font-weight="400">实际交换；分享记录前去掉凭据与敏感正</text>
<text x="1377.25" y="772.0" font-size="18" fill="#53635f" font-weight="400">文。</text>
<text x="64" y="1012.0" font-size="22" fill="#286f64" font-weight="700">关键横向联系</text>
<text x="240" y="1012.0" font-size="17" fill="#53635f" font-weight="400">同一知识点可以参与多种关系；箭头上的词才是连接含义。</text>
<rect x="64" y="1037.0" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1070.0" font-size="21" fill="#233734" font-weight="700">能力使用约定（API）</text>
<rect x="750" y="1037.0" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1070.0" font-size="21" fill="#233734" font-weight="700">消息交换格式（HTTP）</text>
<polyline points="538,1074.0 736,1074.0" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1074.0 726.9955289764732,1078.3496553411123 726.9955289764732,1069.6503446588877" fill="#286f64"/>
<text x="603.0" y="1062.0" font-size="17" fill="#286f64" font-weight="400">本例采用</text>
<text x="80" y="1120.0" font-size="18" fill="#53635f" font-weight="400">API 说明怎样使用创建与读取能力，HTTP 承担这次跨进程消息交换。</text>
<rect x="64" y="1160.2" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1193.2" font-size="21" fill="#233734" font-weight="700">消息交换格式（HTTP）</text>
<rect x="750" y="1160.2" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1193.2" font-size="21" fill="#233734" font-weight="700">数据表示与转换（JSON）</text>
<polyline points="538,1197.2 736,1197.2" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1197.2 726.9955289764732,1201.5496553411124 726.9955289764732,1192.8503446588877" fill="#286f64"/>
<text x="592.8896484375" y="1185.2" font-size="17" fill="#286f64" font-weight="400">body可采用</text>
<text x="80" y="1243.2" font-size="18" fill="#53635f" font-weight="400">本例用 JSON 表示工单字段；HTTP 也能承载其他内容，JSON 不是接口本身。</text>
<rect x="64" y="1283.4" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1316.4" font-size="21" fill="#233734" font-weight="700">能力使用约定（API）</text>
<rect x="750" y="1283.4" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1316.4" font-size="21" fill="#233734" font-weight="700">请求动作（HTTP method）</text>
<polyline points="538,1320.4 736,1320.4" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1320.4 726.9955289764732,1324.7496553411124 726.9955289764732,1316.0503446588878" fill="#286f64"/>
<text x="594.5" y="1308.4" font-size="17" fill="#286f64" font-weight="400">选择并约束</text>
<text x="80" y="1366.4" font-size="18" fill="#53635f" font-weight="400">方法有通用语义，具体路径支持的动作、字段与效果仍由接口合同规定。</text>
<rect x="64" y="1406.6000000000001" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1439.6000000000001" font-size="21" fill="#233734" font-weight="700">数据表示与转换（JSON）</text>
<rect x="750" y="1406.6000000000001" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1439.6000000000001" font-size="21" fill="#233734" font-weight="700">消息内容与附加信息（body / headers）</text>
<polyline points="538,1443.6000000000001 736,1443.6000000000001" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1443.6000000000001 726.9955289764732,1447.9496553411125 726.9955289764732,1439.2503446588878" fill="#286f64"/>
<text x="586.0" y="1431.6000000000001" font-size="17" fill="#286f64" font-weight="400">提供数据表示</text>
<text x="80" y="1489.6000000000001" font-size="18" fill="#53635f" font-weight="400">JSON可表示body字段，但不能独立交代目标、动作和处理结果。</text>
<rect x="64" y="1529.8000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1562.8000000000002" font-size="21" fill="#233734" font-weight="700">内容类型与期望（Content-Type / Accept）</text>
<rect x="750" y="1529.8000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1562.8000000000002" font-size="21" fill="#233734" font-weight="700">状态与内容联合检查</text>
<polyline points="538,1566.8000000000002 736,1566.8000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1566.8000000000002 726.9955289764732,1571.1496553411125 726.9955289764732,1562.4503446588878" fill="#286f64"/>
<text x="577.5" y="1554.8000000000002" font-size="17" fill="#286f64" font-weight="400">只提供一项依据</text>
<text x="80" y="1612.8000000000002" font-size="18" fill="#53635f" font-weight="400">正确媒体类型声明不能替代解析和字段检查，Accept也不会强迫服务返回JSON。</text>
<rect x="64" y="1653.0000000000002" width="460" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="80" y="1686.0000000000002" font-size="21" fill="#233734" font-weight="700">交互文档与 Network</text>
<rect x="750" y="1653.0000000000002" width="986" height="58" rx="6" fill="#ffffff" stroke="#a9bab4"/>
<text x="766" y="1686.0000000000002" font-size="21" fill="#233734" font-weight="700">消息交换格式（HTTP）</text>
<polyline points="538,1690.0000000000002 736,1690.0000000000002" fill="none" stroke="#286f64" stroke-width="2"/>
<polygon points="736,1690.0000000000002 726.9955289764732,1694.3496553411126 726.9955289764732,1685.650344658888" fill="#286f64"/>
<text x="586.0" y="1678.0000000000002" font-size="17" fill="#286f64" font-weight="400">核对实际消息</text>
<text x="80" y="1736.0000000000002" font-size="18" fill="#53635f" font-weight="400">页面显示成功并非完整证据，应观察method、URL、status、headers和body。</text>
<polyline points="64,1794.2000000000003 1736,1794.2000000000003" fill="none" stroke="#a9bab4" stroke-width="1"/>
<text x="64" y="1824.2000000000003" font-size="17" fill="#53635f" font-weight="400">对照正文：B01  ·  地图用于找关系，具体操作与例外仍回到本章。</text>
</svg>
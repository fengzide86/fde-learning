name: Publish learning site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4
      - name: Validate links, catalog, and asset identities
        run: python3 scripts/validate_site.py --site site --report qa/validation-ci.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
